<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Join the BLSNC Quiz</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F2FBFA; --surface:#FFFFFF; --ink:#1B1640; --muted:#57527A; --line:#DCD7F2;
  --head:#1B355A; --on-head:#FFFFFF;
  --coral:#D9432F; --teal:#0E8C8C; --sun:#F5B700; --violet:#6A4BE0; --lime:#5DAE2C; --pink:#E0457B; --orange:#F6A23A;
  --on-sun:#1B1640; --good:#1E9E5A; --good-soft:#DDF6E8; --bad:#D9432F; --bad-soft:#FDE4DF; --deco-o:.16;
  color-scheme:light; box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#120E2E; --surface:#1E1846; --ink:#F2F0FF; --muted:#B7B1DD; --line:#352C6E;
    --coral:#E8553F; --teal:#14A3A3; --sun:#FFC933; --violet:#8468FF; --lime:#7CCB4A; --pink:#FF6A9C;
    --good:#4ED68A; --good-soft:#163D2C; --bad:#FF7A66; --bad-soft:#401E24; --deco-o:.22; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#120E2E; --surface:#1E1846; --ink:#F2F0FF; --muted:#B7B1DD; --line:#352C6E;
  --coral:#E8553F; --teal:#14A3A3; --sun:#FFC933; --violet:#8468FF; --lime:#7CCB4A; --pink:#FF6A9C;
  --good:#4ED68A; --good-soft:#163D2C; --bad:#FF7A66; --bad-soft:#401E24; --deco-o:.22; color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Lexend",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;line-height:1.5;-webkit-text-size-adjust:100%;position:relative;overflow-x:hidden}
button,input{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--sun);outline-offset:3px}
.deco{position:fixed;inset:0;pointer-events:none;z-index:0;opacity:var(--deco-o)}
.deco svg{position:absolute}
.d1{top:7rem;left:-3rem;width:11rem;color:var(--coral)}
.d2{bottom:10%;right:-2.5rem;width:10rem;color:var(--teal)}
.d3{bottom:3rem;left:30%;width:6rem;color:var(--violet)}
.bar{background:var(--head);color:var(--on-head);position:relative;z-index:1}
.bar-inner{max-width:76rem;margin:0 auto;padding:.8rem 1.25rem;display:flex;align-items:center;justify-content:space-between;gap:1rem}
.brand{display:flex;align-items:center;gap:.6rem}
.logo-icon{height:2.6rem;width:auto;display:block}
.wordmark{display:flex;flex-direction:column;line-height:1.05}
.wm-main{font-weight:700;font-size:1.25rem;letter-spacing:.04em}
.wm-sub{font-weight:400;font-size:.62rem;letter-spacing:.12em;text-transform:uppercase;color:var(--orange);margin-top:.2rem;padding-top:.2rem;border-top:1px solid rgba(255,255,255,.35);white-space:nowrap}
.link-btn{background:rgba(255,255,255,.12);border:0;color:var(--on-head);border-radius:999px;padding:.4rem 1rem;font-size:.9rem;cursor:pointer;white-space:nowrap}
.link-btn:hover{background:rgba(255,255,255,.22)}
@media (max-width:420px){.link-btn{font-size:.8rem;padding:.35rem .75rem}}
.weave{height:14px;background:
  linear-gradient(135deg,var(--coral) 25%,transparent 25%) -7px 0/14px 14px,
  linear-gradient(225deg,var(--sun) 25%,transparent 25%) -7px 0/14px 14px,
  linear-gradient(315deg,var(--teal) 25%,transparent 25%) 0 0/14px 14px,
  linear-gradient(45deg,var(--violet) 25%,transparent 25%) 0 0/14px 14px;
  background-color:var(--head)}
main{position:relative;z-index:1;margin:0 auto;padding:1.5rem 1.25rem 4rem}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.5rem;border-radius:999px;padding:1rem 2.1rem;font-weight:700;font-size:1.15rem;cursor:pointer;border:0;min-height:3.4rem;transition:transform .12s}
.btn.primary{background:linear-gradient(180deg,rgba(255,255,255,.25),rgba(255,255,255,0) 55%),linear-gradient(120deg,var(--violet),var(--pink));color:#fff;box-shadow:0 6px 0 #3E2A9E,0 12px 24px rgba(106,75,224,.35);text-shadow:0 1px 0 rgba(0,0,0,.2)}
.btn.primary:hover:not(:disabled){transform:translateY(-2px);filter:brightness(1.08)}
.btn.primary:active:not(:disabled){transform:translateY(4px);box-shadow:0 2px 0 #3E2A9E}
.btn.ghost{background:var(--surface);border:3px solid var(--violet);color:var(--violet);box-shadow:0 6px 0 var(--line)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.pulse{animation:pulse 1.8s ease-in-out infinite}
@keyframes pulse{0%,100%{box-shadow:0 6px 0 #3E2A9E,0 0 0 0 rgba(224,69,123,.5)}50%{box-shadow:0 6px 0 #3E2A9E,0 0 0 14px rgba(224,69,123,0)}}
.actions{display:flex;flex-wrap:wrap;gap:.9rem;margin-top:1.5rem}
.topic{display:inline-flex;align-items:center;gap:.4rem;font-weight:700;font-size:.95rem;padding:.3rem .9rem;border-radius:999px;color:#fff}
.topic-teamwork{background:var(--coral)} .topic-communication{background:var(--teal)} .topic-leadership{background:var(--violet)}
.tile{display:flex;align-items:center;gap:.85rem;width:100%;text-align:left;border:3px solid rgba(255,255,255,.35);border-radius:20px;padding:1rem 1.1rem;font-weight:600;color:#fff;box-shadow:0 5px 0 rgba(0,0,0,.22);position:relative;text-shadow:0 1px 0 rgba(0,0,0,.15)}
.c0{--tile:var(--coral);background:linear-gradient(180deg,rgba(255,255,255,.24),rgba(255,255,255,0) 60%),var(--coral)}
.c1{--tile:var(--teal);background:linear-gradient(180deg,rgba(255,255,255,.24),rgba(255,255,255,0) 60%),var(--teal)}
.c2{--tile:#C98F00;background:linear-gradient(180deg,rgba(255,255,255,.35),rgba(255,255,255,0) 60%),var(--sun);color:var(--on-sun);text-shadow:none}
.c3{--tile:var(--violet);background:linear-gradient(180deg,rgba(255,255,255,.24),rgba(255,255,255,0) 60%),var(--violet)}
.letter{flex:none;width:2.6rem;height:2.6rem;display:grid;place-items:center;border-radius:50%;background:#fff;color:var(--tile);font-weight:800;font-size:1.3rem;line-height:1;text-shadow:none;box-shadow:0 3px 0 rgba(0,0,0,.15)}
.notice{max-width:40rem;margin:2rem auto;background:var(--surface);border:2px solid var(--line);border-radius:22px;padding:1.5rem}
.notice h1{margin:0 0 .5rem;font-size:1.6rem}
.err{color:var(--bad);font-weight:600;min-height:1.5em;margin:.5rem 0 0}
#confetti{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:50}
@keyframes drop{from{transform:translateY(-8px);opacity:0}to{transform:none;opacity:1}}
@keyframes popin{from{transform:scale(.6);opacity:0}to{transform:scale(1);opacity:1}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
main{max-width:34rem;min-height:calc(100vh - 6rem)}
.card{background:var(--surface);border:2px solid var(--line);border-radius:24px;padding:1.5rem;margin-top:1rem}
.card h1{font-size:clamp(1.6rem,6vw,2.1rem);line-height:1.1;margin:0 0 .4rem;font-weight:800}
.card p.sub{color:var(--muted);margin:0 0 1.25rem}
.field{margin-bottom:1rem}
.field label{display:block;font-weight:700;margin-bottom:.35rem}
.field input{width:100%;padding:.85rem 1rem;border:2px solid var(--line);border-radius:14px;background:var(--bg);font-size:1.15rem}
.field input.pinin{font-size:1.6rem;font-weight:800;letter-spacing:.2em;text-align:center}
.btn.full{width:100%}
.status{text-align:center;padding:2rem 1rem}
.status .em{font-size:4rem;line-height:1;margin-bottom:.75rem;animation:popin .5s cubic-bezier(.2,1.4,.4,1)}
.status h1{font-size:clamp(1.7rem,7vw,2.4rem);line-height:1.1;margin:0 0 .5rem;font-weight:800}
.status p{color:var(--muted);font-size:1.1rem;margin:.3rem 0}
.status.good{background:var(--good-soft);border-radius:24px;margin-top:1rem}
.status.bad{background:var(--bad-soft);border-radius:24px;margin-top:1rem}
.status .pts{font-size:clamp(2rem,9vw,3rem);font-weight:800;color:var(--good)}
.myname{display:inline-block;background:var(--violet);color:#fff;font-weight:700;border-radius:999px;padding:.3rem 1rem;margin-top:.5rem}
.scoreline{display:flex;justify-content:center;gap:.75rem;flex-wrap:wrap;margin-top:1rem}
.scoreline span{background:var(--surface);border:2px solid var(--line);border-radius:999px;padding:.35rem 1rem;font-weight:700}
.pq-top{display:flex;justify-content:space-between;align-items:center;gap:.75rem;margin:.5rem 0 .75rem}
.ptimer{font-weight:800;font-size:1.3rem;min-width:3.2rem;text-align:center;background:var(--violet);color:#fff;border-radius:999px;padding:.2rem .7rem;font-variant-numeric:tabular-nums}
.ptimer.low{background:var(--coral)}
.pq{font-size:clamp(1.15rem,5vw,1.45rem);line-height:1.3;font-weight:700;margin:0 0 1rem}
.popts{display:grid;gap:.75rem}
.popts .tile{cursor:pointer;min-height:4.6rem;font-size:1.05rem;transition:transform .1s}
.popts .tile:active{transform:translateY(3px);box-shadow:0 2px 0 rgba(0,0,0,.22)}
.popts .tile:disabled{opacity:.4;cursor:default}
.rank{font-size:clamp(2.2rem,10vw,3.4rem);font-weight:800;line-height:1;color:var(--violet);margin:.5rem 0}
.lbl{display:block;font-weight:700;margin-bottom:.45rem}
.avatars{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:.4rem}
.av-opt{aspect-ratio:1;border:2px solid var(--line);border-radius:12px;background:var(--bg);font-size:clamp(1.3rem,5.5vw,1.7rem);line-height:1;cursor:pointer;padding:0;display:grid;place-items:center;transition:transform .12s}
.av-opt[aria-pressed="true"]{border-color:var(--violet);background:var(--surface);transform:scale(1.12);box-shadow:0 0 0 3px rgba(106,75,224,.3)}
.bigav{font-size:4.5rem;line-height:1;width:1.6em;height:1.6em;margin:0 auto .75rem;display:grid;place-items:center;border-radius:50%;background:var(--surface);border:4px solid var(--violet);animation:popin .5s cubic-bezier(.2,1.4,.4,1)}

</style>
</head>

<script>
const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;
const esc = t => String(t == null ? "" : t).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function shuffle(a){ a = a.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
const ICONS = { Teamwork:"🤝", Communication:"👥", Leadership:"👑" };
const LETTERS = "ABCD";

function ordinal(n){ const s=["th","st","nd","rd"], v=n%100; return n + (s[(v-20)%10]||s[v]||s[0]); }
function configReady(){ const c = window.FIREBASE_CONFIG; return !!(c && c.apiKey && !/PASTE/i.test(c.apiKey) && c.databaseURL); }

/* ===== Sound engine: everything is generated in the browser, no audio files ===== */
let actx = null, muted = false, master = null, sfxBus = null, musicBus = null, verb = null, noiseBuf = null;
try{ muted = localStorage.getItem("blsnc-live-muted") === "1"; }catch(e){}
function ac(){
  if(!actx){
    const C = window.AudioContext || window.webkitAudioContext; if(!C) return null;
    actx = new C();
    const comp = actx.createDynamicsCompressor(); comp.threshold.value = -14; comp.ratio.value = 4;
    master = actx.createGain(); master.gain.value = muted ? 0 : .9;
    master.connect(comp); comp.connect(actx.destination);
    sfxBus = actx.createGain(); sfxBus.connect(master);
    musicBus = actx.createGain(); musicBus.gain.value = .4; musicBus.connect(master);
    verb = actx.createConvolver();
    const len = Math.floor(actx.sampleRate * 1.6), buf = actx.createBuffer(2, len, actx.sampleRate);
    for(let c=0;c<2;c++){ const d = buf.getChannelData(c); for(let i=0;i<len;i++) d[i] = (Math.random()*2-1) * Math.pow(1-i/len, 3); }
    verb.buffer = buf; const vg = actx.createGain(); vg.gain.value = .22; verb.connect(vg); vg.connect(master);
    const nl = actx.sampleRate; noiseBuf = actx.createBuffer(1, nl, actx.sampleRate);
    const nd = noiseBuf.getChannelData(0); for(let i=0;i<nl;i++) nd[i] = Math.random()*2-1;
  }
  if(actx.state === "suspended") actx.resume();
  return actx;
}
const hz = m => 440 * Math.pow(2, (m-69)/12);
function osc(freq, t, dur, o){
  o = o || {}; const a = actx, g = a.createGain(), v = o.vol || .2, atk = o.attack || .005;
  g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(v, t+atk); g.gain.exponentialRampToValueAtTime(0.0001, t+dur);

  if(o.slide) os.frequency.exponentialRampToValueAtTime(o.slide, t+dur);
  if(o.detune) os.detune.value = o.detune;
  let src = os;
  if(o.lp){ const f = a.createBiquadFilter(); f.type = "lowpass"; f.frequency.setValueAtTime(o.lp, t); if(o.lpEnd) f.frequency.exponentialRampToValueAtTime(o.lpEnd, t+dur); os.connect(f); src = f; }
  src.connect(g); g.connect(o.bus || sfxBus); if(o.verb) g.connect(verb);
  os.start(t); os.stop(t+dur+.05);
}
function nz(t, dur, o){
  o = o || {}; const a = actx, s = a.createBufferSource(); s.buffer = noiseBuf;
  const f = a.createBiquadFilter(); f.type = o.ftype || "highpass"; f.frequency.setValueAtTime(o.freq || 6000, t);
  if(o.freqEnd) f.frequency.exponentialRampToValueAtTime(o.freqEnd, t+dur); f.Q.value = o.q || .7;
  const g = a.createGain(), v = o.vol || .15;
  g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(v, t+(o.attack||.002)); g.gain.exponentialRampToValueAtTime(0.0001, t+dur);
  s.connect(f); f.connect(g); g.connect(o.bus || sfxBus); if(o.verb) g.connect(verb);
  s.start(t, Math.random()*.5); s.stop(t+dur+.05);
}
const kick  = (t,bus,vol) => osc(150, t, .25, { type:"sine", slide:45, vol:vol||.5, bus });
const snare = (t,bus,vol) => { nz(t, .14, { freq:1800, vol:vol||.18, bus }); osc(220, t, .08, { type:"triangle", vol:(vol||.18)*.6, bus }); };
const hat   = (t,bus,vol) => nz(t, .04, { freq:8000, vol:vol||.06, bus });
const bell  = (m,t,vol,bus) => { const f = hz(m); vol = vol || .16; osc(f,t,1.2,{type:"sine",vol,verb:true,bus}); osc(f*2.76,t,.5,{type:"sine",vol:vol*.35,verb:true,bus}); osc(f*5.4,t,.25,{type:"sine",vol:vol*.15,bus}); };
const brass = (m,t,dur,vol) => [-8,0,8].forEach(d => osc(hz(m), t, dur, { type:"sawtooth", detune:d, vol:(vol||.12)/2, attack:.04, lp:900, lpEnd:2800, verb:true }));
function play(fn){ if(muted) return; const a = ac(); if(!a) return; fn(a.currentTime + .01); }
const SFX = {
  click:    () => play(t => { osc(1400,t,.06,{type:"sine",vol:.12}); osc(2100,t,.05,{type:"sine",vol:.05}); }),
  pop:      () => play(t => { osc(400,t,.12,{type:"sine",slide:900,vol:.2}); bell(84,t+.06,.1); }),
  correct:  () => play(t => { [72,76,79,84].forEach((m,i) => bell(m, t+i*.07, .16)); nz(t+.25,.5,{freq:9000,vol:.04,verb:true}); }),
  wrong:    () => play(t => { osc(196,t,.28,{type:"square",vol:.1,lp:900,detune:-10}); osc(196,t,.28,{type:"square",vol:.1,lp:900,detune:10}); osc(147,t+.22,.45,{type:"square",vol:.12,lp:700,slide:105}); }),
  tick:     () => play(t => { osc(1800,t,.03,{type:"sine",vol:.14}); nz(t,.02,{freq:4000,vol:.05}); }),
  timeup:   () => play(t => { osc(110,t,.7,{type:"sawtooth",vol:.16,lp:1400,detune:-15}); osc(110,t,.7,{type:"sawtooth",vol:.16,lp:1400,detune:15}); }),
  whoosh:   () => play(t => nz(t,.5,{ftype:"bandpass",freq:400,freqEnd:4000,q:1.5,vol:.22,attack:.2})),
  sparkle:  () => play(t => [88,91,96,93,100].forEach((m,i) => bell(m, t+i*.06, .07))),
  drumroll: dur => play(t => { dur = dur || 2.4; for(let x=0; x<dur; x+=.045) snare(t+x, sfxBus, .04 + .14*(x/dur)); }),
  crash:    () => play(t => { nz(t,1.8,{freq:5000,vol:.25,verb:true}); kick(t,sfxBus,.6); }),
  fanfare:  () => play(t => {
    const s = .15;
    brass(60,t,s,.14); brass(60,t+s,s,.14); brass(60,t+2*s,s,.14); brass(64,t+3*s,.45,.16);
    brass(67,t+3*s+.45,s*1.2,.16); brass(64,t+4*s+.6,s,.14);
    const e = t + 5*s + .65; brass(72,e,1.8,.2); brass(67,e,1.8,.12);
    [48,55,60].forEach(m => osc(hz(m), e, 2, { type:"triangle", vol:.12, verb:true }));
    kick(e, sfxBus, .6); nz(e, 1.8, { freq:5000, vol:.18, verb:true });
  }),
  applause: dur => play(t => { dur = dur || 3.5; for(let i=0;i<dur*70;i++){ const x = Math.random()*dur; nz(t+x,.05,{ftype:"bandpass",freq:1200+Math.random()*2400,q:.9,vol:.07*(1-x/dur*.7)}); } })
};
/* Background music loops (facilitator screen only) */
const PATTERNS = {
  lobby: { bpm:118, play(s,t,dt){
    const bar = Math.floor(s/8)%4, k = s%8, B = musicBus;
    const roots = [48,45,41,43], ch = [[60,64,67],[57,60,64],[53,57,60],[55,59,62]][bar];
    if(k===0||k===4) kick(t,B,.45); if(k===2||k===6) snare(t,B,.08); hat(t+dt/2,B,.03);
    if([0,3,4,6].includes(k)) osc(hz(roots[bar] + (k===6?7:0)), t, dt*1.6, { type:"triangle", vol:.24, bus:B });
    osc(hz(ch[k%3]+12), t, dt*1.1, { type:"square", vol:.035, lp:2400, bus:B });
    if(k===0) ch.forEach(m => osc(hz(m), t, dt*7.5, { type:"sawtooth", vol:.02, attack:.15, lp:1300, verb:true, bus:B }));
  }},
  question: { bpm:150, play(s,t,dt){
    const bar = Math.floor(s/8)%4, k = s%8, B = musicBus;
    osc(hz([45,41,38,40][bar]), t, dt*.9, { type:"sawtooth", vol:.08, lp:700, bus:B });
    hat(t, B, k%2 ? .025 : .045);
    if(k===0||k===4) kick(t,B,.35);
    if(k%2===0) osc(hz([81,84,88,84][(k/2)%4]), t, dt*.6, { type:"sine", vol:.05, bus:B });
  }},
  calm: { bpm:96, play(s,t,dt){
    const bar = Math.floor(s/8)%2, k = s%8, B = musicBus, ch = [[60,64,67,71],[57,60,64,67]][bar];
    osc(hz(ch[[0,2,1,3,2,1,3,2][k]]+12), t, dt*2, { type:"sine", vol:.06, verb:true, bus:B });
    if(k===0) osc(hz(ch[0]-24), t, dt*8, { type:"triangle", vol:.14, bus:B });
  }}
};
const Music = { timer:null, p:null, step:0, next:0,
  start(name){ this.stop(); const a = ac(); if(!a || !PATTERNS[name]) return; this.p = PATTERNS[name]; this.step = 0; this.next = a.currentTime + .08; this.timer = setInterval(() => this.tick(), 25); },
  tick(){ const dt = 60/this.p.bpm/2; while(this.next < actx.currentTime + .15){ this.p.play(this.step, this.next, dt); this.step++; this.next += dt; } },
  stop(){ clearInterval(this.timer); this.timer = null; }
};
function setupMute(){
  const b = document.getElementById("mute"); if(!b) return;
  const paint = () => { b.textContent = muted ? "🔇 Sound off" : "🔊 Sound on"; b.setAttribute("aria-pressed", String(!muted)); };
  b.onclick = () => {
    muted = !muted; try{ localStorage.setItem("blsnc-live-muted", muted ? "1" : "0"); }catch(e){}
    ac(); if(master) master.gain.setTargetAtTime(muted ? 0 : .9, actx.currentTime, .05);
    paint(); SFX.click();
  };
  paint();
}
function confetti(count){
  if(reduced) return;
  const cv = document.getElementById("confetti"), ctx = cv.getContext("2d");
  const dpr = window.devicePixelRatio || 1;
  cv.width = innerWidth * dpr; cv.height = innerHeight * dpr; ctx.setTransform(dpr,0,0,dpr,0,0);
  const cs = getComputedStyle(document.documentElement);
  const cols = ["--coral","--sun","--teal","--violet","--lime","--pink"].map(v => cs.getPropertyValue(v).trim());
  const P = Array.from({length:count||160}, () => ({
    x: innerWidth/2 + (Math.random()-.5)*innerWidth*.5, y: innerHeight*.35,
    vx: (Math.random()-.5)*14, vy: -Math.random()*13 - 4,
    s: 6 + Math.random()*8, r: Math.random()*6.28, vr: (Math.random()-.5)*.3,
    c: cols[Math.floor(Math.random()*cols.length)], sh: Math.floor(Math.random()*3)
  }));
  let frames = 0;
  (function tick(){
    ctx.clearRect(0,0,innerWidth,innerHeight);
    P.forEach(p => {
      p.vy += .3; p.vx *= .99; p.x += p.vx; p.y += p.vy; p.r += p.vr;
      ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.r); ctx.fillStyle = p.c;
      if(p.sh === 0) ctx.fillRect(-p.s/2,-p.s/4,p.s,p.s/2);
      else if(p.sh === 1){ ctx.beginPath(); ctx.arc(0,0,p.s/2.5,0,6.28); ctx.fill(); }
      else { ctx.beginPath(); ctx.moveTo(0,-p.s/2); ctx.lineTo(p.s/2,p.s/2); ctx.lineTo(-p.s/2,p.s/2); ctx.fill(); }
      ctx.restore();
    });
    if(++frames < 240) requestAnimationFrame(tick); else ctx.clearRect(0,0,innerWidth,innerHeight);
  })();
}

const app = document.getElementById("app");
const params = new URLSearchParams(location.search);
let db = null, TS = null, offset = 0;
const P = { pin:null, pid:null, name:"", avatar:AVATARS[Math.floor(Math.random()*AVATARS.length)], state:null, cur:null, me:null, answeredN:-1, timer:null, key:"", refs:[], celebrated:"" };

function joinScreen(msg){
  P.refs.forEach(r => r.off()); P.refs = [];
  app.innerHTML = `<div class="card">
    <h1>🎮 Join the quiz</h1>
    <p class="sub">Enter the game PIN on the big screen and your name.</p>
    <div class="field"><label for="pin">Game PIN</label><input class="pinin" id="pin" inputmode="numeric" autocomplete="off" maxlength="7" value="${esc(params.get("pin")||"")}"></div>
    <div class="field"><label for="nm">Your name</label><input id="nm" maxlength="20" autocomplete="nickname" value="${esc(P.name)}"></div>
    <div class="field"><span class="lbl" id="avl">Pick your avatar</span>
      <div class="avatars" role="group" aria-labelledby="avl">${AVATARS.map(a=>`<button type="button" class="av-opt" aria-pressed="${a===P.avatar}">${a}</button>`).join("")}</div></div>
    <button class="btn primary full" id="go">✅ Join game</button>
    <p class="err" id="err" role="alert">${esc(msg||"")}</p></div>`;
  app.querySelectorAll(".av-opt").forEach(b => b.onclick = () => {
    P.avatar = b.textContent; SFX.click();
    app.querySelectorAll(".av-opt").forEach(x => x.setAttribute("aria-pressed", String(x === b)));
  });
  const go = document.getElementById("go");
  go.onclick = join;
  document.getElementById("nm").addEventListener("keydown", e => { if(e.key === "Enter") join(); });
  if(params.get("pin")) document.getElementById("nm").focus();
}

async function join(){
  ac();
  const pin = document.getElementById("pin").value.replace(/\D/g,"");
  const name = document.getElementById("nm").value.trim().slice(0,20);
  const err = document.getElementById("err"), go = document.getElementById("go");
  if(pin.length !== 6){ err.textContent = "Enter the 6-digit PIN shown on the screen."; return; }
  if(!name){ err.textContent = "Enter your name so the facilitator can see you."; return; }
  go.disabled = true; err.textContent = "";
  try{
    const s = await db.ref("games/"+pin+"/state").once("value");
    if(!s.exists()){ err.textContent = "No game found with that PIN. Check the number on the screen."; go.disabled = false; return; }
    if(s.val() === "end"){ err.textContent = "That game has finished. Ask the facilitator for the new PIN."; go.disabled = false; return; }
    const pid = "p" + Date.now().toString(36) + Math.random().toString(36).slice(2,7);
    await db.ref(`games/${pin}/players/${pid}`).set({ name, avatar:P.avatar, score:0, joined:TS });
    Object.assign(P, { pin, pid, name, answeredN:-1, key:"" });
    try{ sessionStorage.setItem("blsnc-live", JSON.stringify({ pin, pid, name, avatar:P.avatar })); }catch(e){}
    SFX.pop();
    listen();
  }catch(e){
    console.error(e); err.textContent = "Couldn’t connect. Check your internet and try again."; go.disabled = false;
  }
}

function listen(){
  const base = "games/" + P.pin;
  const r1 = db.ref(base+"/state"), r2 = db.ref(base+"/cur"), r3 = db.ref(`${base}/players/${P.pid}`);
  P.refs = [r1,r2,r3];
  r1.on("value", s => { P.state = s.val(); if(P.state === null){ forget(); joinScreen("The game has closed. Enter a new PIN to join again."); return; } render(); });
  r2.on("value", s => { P.cur = s.val(); render(); });
  r3.on("value", s => { P.me = s.val(); render(); });
}
function forget(){ try{ sessionStorage.removeItem("blsnc-live"); }catch(e){} P.refs.forEach(r => r.off()); P.refs = []; }

async function myRank(){
  const s = await db.ref(`games/${P.pin}/players`).once("value");
  const list = Object.entries(s.val()||{}).map(([id,p]) => ({ id, score:p.score||0 })).sort((a,b) => b.score - a.score);
  return { rank: list.findIndex(p => p.id === P.pid) + 1, total: list.length };
}

function render(){
  if(!P.state) return;
  const cur = P.cur || {};
  const key = [P.state, cur.n, cur.correct, P.answeredN === cur.n, P.me && P.me.score].join("|");
  if(key === P.key) return;
  P.key = key;
  clearInterval(P.timer);
  const name = esc(P.name);
  if(P.state === "lobby"){
    app.innerHTML = `<div class="status"><div class="bigav" aria-hidden="true">${esc(P.avatar)}</div><h1>You’re in!</h1>
      <p>Look for your name on the big screen. The game starts soon.</p><span class="myname">${name}</span></div>`;
  }
  else if(P.state === "question"){
    if(P.answeredN === cur.n){
      app.innerHTML = `<div class="status"><div class="em" aria-hidden="true">📨</div><h1>Answer sent!</h1><p>Waiting for everyone else…</p></div>`;
      return;
    }
    app.innerHTML = `
      <div class="pq-top"><span class="topic topic-${String(cur.topic||"").toLowerCase()}"><span aria-hidden="true">${ICONS[cur.topic]||""}</span>${esc(cur.topic)}</span>
        <span class="ptimer" id="pt" aria-label="Seconds left"></span></div>
      <p class="pq">${cur.n+1}. ${esc(cur.q)}</p>
      <div class="popts">${(cur.options||[]).map((t,i)=>`<button class="tile c${i}" data-i="${i}"><span class="letter">${LETTERS[i]}</span><span>${esc(t)}</span></button>`).join("")}</div>`;
    app.querySelectorAll(".tile").forEach(b => b.onclick = () => answer(+b.dataset.i));
    const deadline = (cur.start || Date.now()) - offset + (cur.dur||15)*1000;
    const pt = document.getElementById("pt");
    const tick = () => {
      const left = Math.max(0, Math.ceil((deadline - Date.now())/1000));
      pt.textContent = left; pt.classList.toggle("low", left <= 5);
      if(left <= 0){
        clearInterval(P.timer);
        app.querySelectorAll(".tile").forEach(b => b.disabled = true);
        app.insertAdjacentHTML("beforeend", `<div class="status"><div class="em" aria-hidden="true">⏰</div><h1>Time’s up!</h1></div>`);
        SFX.timeup();
      }
    };
    tick(); P.timer = setInterval(tick, 250);
  }
  else if(P.state === "reveal"){
    const last = (P.me && P.me.last) || { none:true };
    const right = cur.options && cur.correct != null ? `${LETTERS[cur.correct]}. ${esc(cur.options[cur.correct])}` : "";
    const cls = last.ok ? "good" : "bad";
    const head = last.ok ? `<div class="em" aria-hidden="true">🎉</div><h1>Correct!</h1><div class="pts">+${last.pts}</div>`
               : last.none ? `<div class="em" aria-hidden="true">⏰</div><h1>No answer this time</h1>`
               : `<div class="em" aria-hidden="true">💡</div><h1>Not quite</h1>`;
    app.innerHTML = `<div class="status ${cls}">${head}
      ${last.ok ? "" : `<p>Correct answer: <strong>${right}</strong></p>`}
      <div class="scoreline"><span>${esc(P.avatar)} ⭐ ${(P.me&&P.me.score)||0} points</span><span id="rk">…</span></div></div>`;
    if(P.celebrated !== "r"+cur.n){ P.celebrated = "r"+cur.n; (last.ok ? SFX.correct : SFX.wrong)(); }
    myRank().then(r => { const el = document.getElementById("rk"); if(el && r.rank) el.textContent = `🏅 ${ordinal(r.rank)} of ${r.total}`; });
  }
  else if(P.state === "leaderboard"){
    app.innerHTML = `<div class="status"><div class="bigav" aria-hidden="true">${esc(P.avatar)}</div><h1>Check the big screen</h1>
      <p>You’re in</p><div class="rank" id="rk">…</div><p>⭐ ${(P.me&&P.me.score)||0} points</p></div>`;
    myRank().then(r => { const el = document.getElementById("rk"); if(el && r.rank) el.textContent = ordinal(r.rank) + " place"; });
  }
  else if(P.state === "end"){
    app.innerHTML = `<div class="status"><div class="bigav" aria-hidden="true">${esc(P.avatar)}</div><div class="em" id="medal" aria-hidden="true">🏁</div><h1>Game over</h1>
      <p>You finished</p><div class="rank" id="rk">…</div><p>⭐ ${(P.me&&P.me.score)||0} points</p>
      <p>Thanks for playing, ${name}!</p></div>`;
    myRank().then(r => {
      const el = document.getElementById("rk"); if(!el || !r.rank) return;
      el.textContent = ordinal(r.rank) + " place";
      if(r.rank <= 3){
        document.getElementById("medal").textContent = ["🥇","🥈","🥉"][r.rank-1];
        if(P.celebrated !== "end"){ P.celebrated = "end"; setTimeout(() => { SFX.fanfare(); confetti(180); }, 9000); }
      }
    });
    forget();
  }
}

async function answer(i){
  const cur = P.cur; if(!cur || P.answeredN === cur.n) return;
  P.answeredN = cur.n;
  SFX.click();
  if(navigator.vibrate) try{ navigator.vibrate(40); }catch(e){}
  render();
  try{ await db.ref(`games/${P.pin}/answers/${cur.n}/${P.pid}`).set({ c:i, at:TS }); }
  catch(e){ P.answeredN = -1; P.key = ""; render(); }
}

setupMute();
if(!configReady() || typeof firebase === "undefined"){
  app.innerHTML = `<div class="card"><h1>⚙️ Not ready yet</h1><p class="sub">This game isn’t connected yet. Ask the facilitator to check the setup.</p></div>`;
} else {
  firebase.initializeApp(window.FIREBASE_CONFIG);
  db = firebase.database();
  TS = firebase.database.ServerValue.TIMESTAMP;
  db.ref(".info/serverTimeOffset").on("value", s => { offset = s.val() || 0; });
  let saved = null;
  try{ saved = JSON.parse(sessionStorage.getItem("blsnc-live") || "null"); }catch(e){}
  if(saved && (!params.get("pin") || params.get("pin") === saved.pin)){
    Object.assign(P, saved);
    db.ref(`games/${saved.pin}/players/${saved.pid}`).once("value").then(s => { if(s.exists()) listen(); else { forget(); joinScreen(); } });
  } else joinScreen();
}

</script>
