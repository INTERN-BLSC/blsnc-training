<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>BLSNC Lucky Draw</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F2FBFA; --surface:#FFFFFF; --ink:#1B1640; --muted:#57527A; --line:#DCD7F2;
  --head:#1B355A; --on-head:#FFFFFF;
  --coral:#D9432F; --teal:#0E8C8C; --sun:#F5B700; --violet:#6A4BE0; --lime:#5DAE2C; --pink:#E0457B; --orange:#F6A23A;
  --on-sun:#1B1640; --deco-o:.16;
  color-scheme:light; box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#120E2E; --surface:#1E1846; --ink:#F2F0FF; --muted:#B7B1DD; --line:#352C6E;
    --coral:#E8553F; --teal:#14A3A3; --sun:#FFC933; --violet:#8468FF; --lime:#7CCB4A; --pink:#FF6A9C;
    --deco-o:.22; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#120E2E; --surface:#1E1846; --ink:#F2F0FF; --muted:#B7B1DD; --line:#352C6E;
  --coral:#E8553F; --teal:#14A3A3; --sun:#FFC933; --violet:#8468FF; --lime:#7CCB4A; --pink:#FF6A9C;
  --deco-o:.22; color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Lexend",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;line-height:1.5;-webkit-text-size-adjust:100%;position:relative;overflow-x:hidden}
button,textarea,input{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--sun);outline-offset:3px}

.deco{position:fixed;inset:0;pointer-events:none;z-index:0;opacity:var(--deco-o)}
.deco svg{position:absolute}
.d1{top:7rem;left:-3rem;width:11rem;color:var(--coral)}
.d2{bottom:10%;right:-2.5rem;width:10rem;color:var(--teal)}
.d3{bottom:3rem;left:30%;width:6rem;color:var(--violet)}

.bar{background:var(--head);color:var(--on-head);position:relative;z-index:1}
.bar-inner{max-width:72rem;margin:0 auto;padding:.8rem 1.25rem;display:flex;align-items:center;justify-content:space-between;gap:1rem}
.brand{display:flex;align-items:center;gap:.6rem}
.logo-icon{height:2.6rem;width:auto;display:block}
.wordmark{display:flex;flex-direction:column;line-height:1.05}
.wm-main{font-weight:700;font-size:1.25rem;letter-spacing:.04em}
.wm-sub{font-weight:400;font-size:.62rem;letter-spacing:.12em;text-transform:uppercase;color:var(--orange);margin-top:.2rem;padding-top:.2rem;border-top:1px solid rgba(255,255,255,.35);white-space:nowrap}
.link-btn{background:rgba(255,255,255,.12);border:0;color:var(--on-head);border-radius:999px;padding:.4rem 1rem;font-size:.9rem;cursor:pointer;white-space:nowrap}
.link-btn:hover{background:rgba(255,255,255,.22)}
@media (max-width:420px){.link-btn{font-size:.8rem;padding:.35rem .75rem}}
.weave{height:14px;background:
  linear-gradient(135deg,var(--coral) 25%,transparent 25%) -7px 0/14px 14px,
  linear-gradient(225deg,var(--sun) 25%,transparent 25%) -7px 0/14px 14px,
  linear-gradient(315deg,var(--teal) 25%,transparent 25%) 0 0/14px 14px,
  linear-gradient(45deg,var(--violet) 25%,transparent 25%) 0 0/14px 14px;
  background-color:var(--head)}

.layout{max-width:72rem;margin:0 auto;padding:1.5rem 1.25rem 4rem;display:grid;gap:1.5rem;grid-template-columns:minmax(0,1fr);position:relative;z-index:1}
@media (min-width:900px){.layout{grid-template-columns:minmax(0,1.7fr) minmax(19rem,1fr);align-items:start}}

/* Stage */
.stage{border-radius:28px;padding:clamp(1.25rem,4vw,2.5rem);min-height:clamp(22rem,56vh,34rem);display:flex;flex-direction:column;gap:1.25rem;position:relative;overflow:hidden;color:#fff;
  background:radial-gradient(circle at 15% 10%,rgba(255,255,255,.12),transparent 40%),linear-gradient(135deg,#1B355A 0%,#3A2A8C 55%,#6A2B8C 100%);
  box-shadow:0 18px 40px rgba(27,53,90,.35)}
.stage .sparkle{position:absolute;color:var(--sun);opacity:.9;pointer-events:none}
.sp1{top:4.2rem;right:1.6rem;width:1.6rem} .sp2{bottom:5.5rem;right:12%;width:1rem;color:var(--pink)!important} .sp3{top:42%;left:1rem;width:.9rem;color:#7FE0E0!important}
.stage::after{content:"";position:absolute;inset:auto -5rem -6rem auto;width:18rem;height:18rem;border-radius:50%;
  background:conic-gradient(var(--coral),var(--sun),var(--teal),var(--violet),var(--coral));opacity:.18;filter:blur(2px)}
.stage-top{display:flex;justify-content:space-between;align-items:center;gap:.75rem;flex-wrap:wrap;position:relative;z-index:1}
.pill{background:rgba(255,255,255,.14);border-radius:999px;padding:.35rem .9rem;font-size:.95rem;font-weight:500}
.pill strong{color:var(--sun);font-weight:800}
.display{flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;gap:.6rem;position:relative;z-index:1;min-height:9rem}
.congrats{font-weight:700;font-size:clamp(1rem,2.6vw,1.3rem);color:var(--sun);letter-spacing:.02em;visibility:hidden}
.congrats.show{visibility:visible;animation:drop .5s cubic-bezier(.2,1.4,.4,1)}
.name{font-size:clamp(2.6rem,9vw,6.5rem);font-weight:800;line-height:1.05;letter-spacing:-.03em;overflow-wrap:anywhere;margin:0}
.name.idle{font-size:clamp(1.3rem,3.8vw,2.2rem);font-weight:500;color:rgba(255,255,255,.75);letter-spacing:-.01em}
.name.rolling{color:#fff;text-shadow:0 0 18px rgba(255,255,255,.35)}
.name.won{display:inline-block;background:linear-gradient(135deg,var(--sun),var(--orange));color:#1B1640;padding:.08em .35em;border-radius:.22em;box-shadow:0 .12em 0 rgba(0,0,0,.25),0 0 40px rgba(245,183,0,.55);animation:pop .55s cubic-bezier(.2,1.5,.4,1)}
@keyframes pop{0%{transform:scale(.6) rotate(-4deg)}100%{transform:scale(1) rotate(0)}}
@keyframes drop{from{transform:translateY(-8px);opacity:0}to{transform:none;opacity:1}}
.stage-actions{display:flex;flex-direction:column;align-items:center;gap:.5rem;position:relative;z-index:1}
.draw{background:linear-gradient(180deg,rgba(255,255,255,.3),rgba(255,255,255,0) 55%),linear-gradient(120deg,var(--sun),var(--orange) 55%,var(--pink));
  color:#1B1640;border:3px solid rgba(255,255,255,.5);border-radius:999px;padding:1.05rem 2.6rem;font-weight:800;font-size:clamp(1.15rem,3vw,1.4rem);cursor:pointer;min-height:3.8rem;
  box-shadow:0 7px 0 #A0560E,0 14px 30px rgba(0,0,0,.3);transition:transform .12s,box-shadow .12s}
.draw:hover:not(:disabled){transform:translateY(-2px);box-shadow:0 9px 0 #A0560E,0 18px 34px rgba(0,0,0,.32)}
.draw:active:not(:disabled){transform:translateY(5px);box-shadow:0 2px 0 #A0560E}
.draw:disabled{opacity:.55;cursor:not-allowed}
.draw.pulse{animation:pulse 1.8s ease-in-out 4}
@keyframes pulse{0%,100%{box-shadow:0 7px 0 #A0560E,0 0 0 0 rgba(245,183,0,.6)}50%{box-shadow:0 7px 0 #A0560E,0 0 0 16px rgba(245,183,0,0)}}
.hint{color:rgba(255,255,255,.7);font-size:.9rem}
@media (hover:none){.hint{display:none}}

/* Side panels */
.panel{background:var(--surface);border:2px solid var(--line);border-radius:22px;padding:1.25rem;position:relative;overflow:hidden}
.panel::before{content:"";position:absolute;left:0;right:0;top:0;height:6px;background:var(--pc,var(--teal))}
.panel + .panel{margin-top:1.25rem}
.p-names{--pc:linear-gradient(90deg,var(--teal),var(--lime))}
.p-winners{--pc:linear-gradient(90deg,var(--coral),var(--sun),var(--violet))}
.panel h2{font-size:1.2rem;margin:.25rem 0 .2rem;display:flex;align-items:center;gap:.5rem}
.panel p.sub{margin:0 0 .9rem;color:var(--muted);font-size:.92rem}
textarea{width:100%;min-height:13rem;resize:vertical;border:2px solid var(--line);border-radius:14px;padding:.75rem .85rem;background:var(--bg);line-height:1.55}
.count{display:inline-block;margin:.6rem 0 .5rem;font-weight:600;background:var(--bg);border-radius:999px;padding:.25rem .8rem;font-size:.9rem}
.check{display:flex;align-items:flex-start;gap:.6rem;cursor:pointer;margin:.5rem 0}
.check input{width:1.2rem;height:1.2rem;margin-top:.2rem;accent-color:var(--violet)}
.row{display:flex;flex-wrap:wrap;gap:.5rem;margin-top:.75rem}
.btn{background:var(--surface);border:2px solid var(--line);border-radius:999px;padding:.5rem 1rem;font-weight:600;font-size:.9rem;cursor:pointer;min-height:2.75rem;box-shadow:0 3px 0 var(--line);transition:transform .12s}
.btn:hover:not(:disabled){transform:translateY(-1px);border-color:var(--violet)}
.btn:active:not(:disabled){transform:translateY(2px);box-shadow:none}
.btn:disabled{opacity:.45;cursor:not-allowed}
ol.winners{list-style:none;margin:0;padding:0;display:grid;gap:.5rem}
ol.winners li{display:flex;align-items:center;gap:.7rem;padding:.55rem .7rem;border-radius:14px;background:var(--bg);font-weight:600}
ol.winners .no{flex:none;width:2rem;height:2rem;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:800;font-size:.9rem}
ol.winners li:nth-child(4n+1) .no{background:var(--coral)} ol.winners li:nth-child(4n+2) .no{background:var(--teal)}
ol.winners li:nth-child(4n+3) .no{background:var(--sun);color:#1B1640} ol.winners li:nth-child(4n+4) .no{background:var(--violet)}
ol.winners .nm{flex:1;overflow-wrap:anywhere}
ol.winners time{color:var(--muted);font-weight:400;font-size:.82rem}
ol.winners li.latest{outline:3px solid var(--sun);animation:drop .4s ease}
.empty{color:var(--muted);margin:0;padding:1rem;text-align:center;background:var(--bg);border-radius:14px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
#confetti{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:5}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

<script>
const STORE_KEY = "blsc-lucky-draw-v1";
const $ = id => document.getElementById(id);
const els = { names:$("names"), count:$("count"), remove:$("removeAfter"), name:$("name"), draw:$("drawBtn"),
  pool:$("poolInfo"), drawNo:$("drawNo"), winners:$("winners"), announce:$("announce"), congrats:$("congrats") };
let winners = [];
let rolling = false, justWon = false;
const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;

/* Sound effects, made in the browser (no files needed) */
let actx = null, muted = false;
try{ muted = localStorage.getItem("blsnc-draw-muted") === "1"; }catch(e){}
function ac(){
  if(!actx){ const C = window.AudioContext || window.webkitAudioContext; if(!C) return null; actx = new C(); }
  if(actx.state === "suspended") actx.resume();
  return actx;
}
function tone(freq, start, dur, type, vol){
  if(muted) return; const a = ac(); if(!a) return;
  const t = a.currentTime + start, o = a.createOscillator(), g = a.createGain();
  o.type = type || "triangle"; o.frequency.setValueAtTime(freq, t);
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(vol || .18, t + .012);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g); g.connect(a.destination); o.start(t); o.stop(t + dur + .05);
}
const SFX = {
  tick: p => tone(500 + p * 700, 0, .04, "square", .05),
  win: () => { [523.25,659.25,783.99,1046.5].forEach((f,i)=>tone(f,i*.11,.2)); tone(1046.5,.48,.8,"triangle",.16); tone(783.99,.48,.8,"triangle",.1); tone(1318.5,.62,.6,"sine",.08); },
  click: () => tone(660, 0, .08, "triangle", .12)
};
const muteBtn = $("mute");
function paintMute(){ muteBtn.textContent = muted ? "🔇 Sound off" : "🔊 Sound on"; muteBtn.setAttribute("aria-pressed", String(!muted)); }
muteBtn.onclick = () => { muted = !muted; try{ localStorage.setItem("blsnc-draw-muted", muted ? "1" : "0"); }catch(e){} paintMute(); SFX.click(); };
paintMute();

const esc = t => String(t).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const getNames = () => els.names.value.split(/\r?\n|\t/).map(s => s.trim()).filter(Boolean);
const setNames = arr => { els.names.value = arr.join("\n"); refresh(); };
function randInt(n){ const a = new Uint32Array(1); crypto.getRandomValues(a); return a[0] % n; }

function save(){ try{ localStorage.setItem(STORE_KEY, JSON.stringify({ names: els.names.value, winners, removeAfter: els.remove.checked })); }catch(e){} }
function load(){
  try{
    const d = JSON.parse(localStorage.getItem(STORE_KEY) || "null");
    if(d){ els.names.value = d.names || ""; winners = Array.isArray(d.winners) ? d.winners : []; els.remove.checked = d.removeAfter !== false; }
  }catch(e){}
}

function refresh(){
  const n = getNames().length;
  els.count.textContent = n === 1 ? "1 name in the draw" : n + " names in the draw";
  els.pool.innerHTML = `👥 <strong>${n}</strong> ${n===1?"name":"names"} left`;
  els.drawNo.hidden = !winners.length;
  els.drawNo.innerHTML = `🏆 <strong>${winners.length}</strong> drawn`;
  els.draw.disabled = rolling || n === 0;
  if(!rolling && n === 0 && els.name.classList.contains("idle")){
    showIdle(winners.length ? "Everyone has been drawn. Put names back to draw again." : "Add names, then press Draw.");
  }
  els.winners.innerHTML = winners.length
    ? `<ol class="winners">${winners.map((w,i)=>`<li${justWon && i===winners.length-1 ? ' class="latest"' : ""}><span class="no">${i+1}</span><span class="nm">${esc(w.name)}</span><time>${esc(w.time)}</time></li>`).join("")}</ol>`
    : `<p class="empty">No names drawn yet. Press 🎁 Draw a name to start.</p>`;
  justWon = false;
  $("undo").disabled = $("putBack").disabled = $("clearWinners").disabled = !winners.length || rolling;
  save();
}
function showIdle(text){ els.name.className = "name idle"; els.name.textContent = text; els.congrats.classList.remove("show"); }

function draw(){
  const pool = getNames();
  if(rolling || !pool.length) return;
  els.draw.classList.remove("pulse");
  ac();
  const pick = randInt(pool.length);
  const winner = pool[pick];
  els.congrats.classList.remove("show");
  const finish = () => {
    rolling = false;
    els.name.className = "name won";
    els.name.textContent = winner;
    els.congrats.classList.add("show");
    els.announce.textContent = "Congratulations, " + winner;
    const removed = els.remove.checked;
    winners.push({ name: winner, time: new Date().toLocaleTimeString(undefined,{hour:"2-digit",minute:"2-digit"}), removed });
    if(removed){ pool.splice(pick, 1); els.names.value = pool.join("\n"); }
    justWon = true;
    refresh();
    SFX.win();
    confetti();
    els.draw.focus({preventScroll:true});
  };
  if(reduced || pool.length === 1){ finish(); return; }
  rolling = true; refresh();
  els.name.className = "name rolling";
  let delay = 45, elapsed = 0, last = -1;
  const step = () => {
    let i = randInt(pool.length);
    if(pool.length > 1 && i === last) i = (i + 1) % pool.length;
    last = i;
    els.name.textContent = pool[i];
    SFX.tick(Math.min(elapsed / 3000, 1));
    elapsed += delay;
    if(elapsed > 3000){ finish(); return; }
    if(elapsed > 1400) delay *= 1.17;
    setTimeout(step, delay);
  };
  step();
}

function confetti(){
  if(reduced) return;
  const cv = $("confetti"), ctx = cv.getContext("2d");
  const dpr = window.devicePixelRatio || 1;
  cv.width = innerWidth * dpr; cv.height = innerHeight * dpr; ctx.setTransform(dpr,0,0,dpr,0,0);
  const cs = getComputedStyle(document.documentElement);
  const cols = ["--coral","--sun","--teal","--violet","--lime","--pink"].map(v => cs.getPropertyValue(v).trim());
  const r = els.name.getBoundingClientRect();
  const cx = r.left + r.width/2, cy = r.top + r.height/2;
  const P = Array.from({length:160}, () => ({
    x: cx, y: cy, vx: (Math.random()-.5)*16, vy: -Math.random()*14 - 3,
    s: 6 + Math.random()*7, r: Math.random()*6.28, vr: (Math.random()-.5)*.3,
    c: cols[Math.floor(Math.random()*cols.length)], sh: Math.floor(Math.random()*3)
  }));
  let frames = 0;
  (function tick(){
    ctx.clearRect(0,0,innerWidth,innerHeight);
    P.forEach(p => {
      p.vy += .32; p.vx *= .99; p.x += p.vx; p.y += p.vy; p.r += p.vr;
      ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.r); ctx.fillStyle = p.c;
      if(p.sh === 0) ctx.fillRect(-p.s/2,-p.s/4,p.s,p.s/2);
      else if(p.sh === 1){ ctx.beginPath(); ctx.arc(0,0,p.s/2.5,0,6.28); ctx.fill(); }
      else { ctx.beginPath(); ctx.moveTo(0,-p.s/2); ctx.lineTo(p.s/2,p.s/2); ctx.lineTo(-p.s/2,p.s/2); ctx.fill(); }
      ctx.restore();
    });
    if(++frames < 200) requestAnimationFrame(tick); else ctx.clearRect(0,0,innerWidth,innerHeight);
  })();
}

els.draw.onclick = draw;
document.addEventListener("keydown", e => {
  if((e.code === "Space" || e.key === " ") && !["TEXTAREA","INPUT","BUTTON"].includes(e.target.tagName)){
    e.preventDefault(); draw();
  }
});
els.names.addEventListener("input", refresh);
els.remove.addEventListener("change", save);
$("tidy").onclick = () => { const seen = new Set(); setNames(getNames().filter(n => { const k = n.toLowerCase(); if(seen.has(k)) return false; seen.add(k); return true; })); };
$("clearNames").onclick = () => { if(!getNames().length || confirm("Remove all names from the draw?")) setNames([]); };
$("undo").onclick = () => {
  const w = winners.pop(); if(!w) return;
  if(w.removed) els.names.value = getNames().concat(w.name).join("\n");
  showIdle(winners.length ? "Last draw undone." : "Add names, then press Draw.");
  refresh();
};
$("putBack").onclick = () => {
  const back = winners.filter(w => w.removed).map(w => w.name);
  winners = [];
  setNames(getNames().concat(back));
  showIdle("All names are back in the draw.");
  refresh();
};
$("clearWinners").onclick = () => { if(confirm("Clear the list of drawn names? Names already removed from the draw stay removed.")){ winners = []; refresh(); } };

load();
refresh();
if(getNames().length) showIdle("Ready when you are.");
</script>
</body>
</html>
