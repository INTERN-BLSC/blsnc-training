<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>BLSNC Live Quiz (Facilitator)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F2FBFA; --surface:#FFFFFF; --ink:#1B1640; --muted:#57527A; --line:#DCD7F2;
  --head:#1B355A; --on-head:#FFFFFF;
  --coral:#D9432F; --teal:#0E8C8C; --sun:#F5B700; --violet:#6A4BE0; --lime:#5DAE2C; --pink:#E0457B; --orange:#F6A23A;
  --on-sun:#1B1640; --good:#1E9E5A; --good-soft:#DDF6E8; --bad:#D9432F; --bad-soft:#FDE4DF; --deco-o:.16;
  color-scheme:light; box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#120E2E; --surface:#1E1846; --ink:#F2F0FF; --muted:#B7B1DD; --line:#352C6E;
    --coral:#E8553F; --teal:#14A3A3; --sun:#FFC933; --violet:#8468FF; --lime:#7CCB4A; --pink:#FF6A9C;
    --good:#4ED68A; --good-soft:#163D2C; --bad:#FF7A66; --bad-soft:#401E24; --deco-o:.22; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#120E2E; --surface:#1E1846; --ink:#F2F0FF; --muted:#B7B1DD; --line:#352C6E;
  --coral:#E8553F; --teal:#14A3A3; --sun:#FFC933; --violet:#8468FF; --lime:#7CCB4A; --pink:#FF6A9C;
  --good:#4ED68A; --good-soft:#163D2C; --bad:#FF7A66; --bad-soft:#401E24; --deco-o:.22; color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Lexend",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;line-height:1.5;-webkit-text-size-adjust:100%;position:relative;overflow-x:hidden}
button,input{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--sun);outline-offset:3px}
.deco{position:fixed;inset:0;pointer-events:none;z-index:0;opacity:var(--deco-o)}
.deco svg{position:absolute}
.d1{top:7rem;left:-3rem;width:11rem;color:var(--coral)}
.d2{bottom:10%;right:-2.5rem;width:10rem;color:var(--teal)}
.d3{bottom:3rem;left:30%;width:6rem;color:var(--violet)}
.bar{background:var(--head);color:var(--on-head);position:relative;z-index:1}
.bar-inner{max-width:76rem;margin:0 auto;padding:.8rem 1.25rem;display:flex;align-items:center;justify-content:space-between;gap:1rem}
.brand{display:flex;align-items:center;gap:.6rem}
.logo-icon{height:2.6rem;width:auto;display:block}
.wordmark{display:flex;flex-direction:column;line-height:1.05}
.wm-main{font-weight:700;font-size:1.25rem;letter-spacing:.04em}
.wm-sub{font-weight:400;font-size:.62rem;letter-spacing:.12em;text-transform:uppercase;color:var(--orange);margin-top:.2rem;padding-top:.2rem;border-top:1px solid rgba(255,255,255,.35);white-space:nowrap}
.link-btn{background:rgba(255,255,255,.12);border:0;color:var(--on-head);border-radius:999px;padding:.4rem 1rem;font-size:.9rem;cursor:pointer;white-space:nowrap}
.link-btn:hover{background:rgba(255,255,255,.22)}
@media (max-width:420px){.link-btn{font-size:.8rem;padding:.35rem .75rem}}
.weave{height:14px;background:
  linear-gradient(135deg,var(--coral) 25%,transparent 25%) -7px 0/14px 14px,
  linear-gradient(225deg,var(--sun) 25%,transparent 25%) -7px 0/14px 14px,
  linear-gradient(315deg,var(--teal) 25%,transparent 25%) 0 0/14px 14px,
  linear-gradient(45deg,var(--violet) 25%,transparent 25%) 0 0/14px 14px;
  background-color:var(--head)}
main{position:relative;z-index:1;margin:0 auto;padding:1.5rem 1.25rem 4rem}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.5rem;border-radius:999px;padding:1rem 2.1rem;font-weight:700;font-size:1.15rem;cursor:pointer;border:0;min-height:3.4rem;transition:transform .12s}
.btn.primary{background:linear-gradient(180deg,rgba(255,255,255,.25),rgba(255,255,255,0) 55%),linear-gradient(120deg,var(--violet),var(--pink));color:#fff;box-shadow:0 6px 0 #3E2A9E,0 12px 24px rgba(106,75,224,.35);text-shadow:0 1px 0 rgba(0,0,0,.2)}
.btn.primary:hover:not(:disabled){transform:translateY(-2px);filter:brightness(1.08)}
.btn.primary:active:not(:disabled){transform:translateY(4px);box-shadow:0 2px 0 #3E2A9E}
.btn.ghost{background:var(--surface);border:3px solid var(--violet);color:var(--violet);box-shadow:0 6px 0 var(--line)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.pulse{animation:pulse 1.8s ease-in-out infinite}
@keyframes pulse{0%,100%{box-shadow:0 6px 0 #3E2A9E,0 0 0 0 rgba(224,69,123,.5)}50%{box-shadow:0 6px 0 #3E2A9E,0 0 0 14px rgba(224,69,123,0)}}
.actions{display:flex;flex-wrap:wrap;gap:.9rem;margin-top:1.5rem}
.topic{display:inline-flex;align-items:center;gap:.4rem;font-weight:700;font-size:.95rem;padding:.3rem .9rem;border-radius:999px;color:#fff}
.topic-teamwork{background:var(--coral)} .topic-communication{background:var(--teal)} .topic-leadership{background:var(--violet)}
.tile{display:flex;align-items:center;gap:.85rem;width:100%;text-align:left;border:3px solid rgba(255,255,255,.35);border-radius:20px;padding:1rem 1.1rem;font-weight:600;color:#fff;box-shadow:0 5px 0 rgba(0,0,0,.22);position:relative;text-shadow:0 1px 0 rgba(0,0,0,.15)}
.c0{--tile:var(--coral);background:linear-gradient(180deg,rgba(255,255,255,.24),rgba(255,255,255,0) 60%),var(--coral)}
.c1{--tile:var(--teal);background:linear-gradient(180deg,rgba(255,255,255,.24),rgba(255,255,255,0) 60%),var(--teal)}
.c2{--tile:#C98F00;background:linear-gradient(180deg,rgba(255,255,255,.35),rgba(255,255,255,0) 60%),var(--sun);color:var(--on-sun);text-shadow:none}
.c3{--tile:var(--violet);background:linear-gradient(180deg,rgba(255,255,255,.24),rgba(255,255,255,0) 60%),var(--violet)}
.letter{flex:none;width:2.6rem;height:2.6rem;display:grid;place-items:center;border-radius:50%;background:#fff;color:var(--tile);font-weight:800;font-size:1.3rem;line-height:1;text-shadow:none;box-shadow:0 3px 0 rgba(0,0,0,.15)}
.notice{max-width:40rem;margin:2rem auto;background:var(--surface);border:2px solid var(--line);border-radius:22px;padding:1.5rem}
.notice h1{margin:0 0 .5rem;font-size:1.6rem}
.err{color:var(--bad);font-weight:600;min-height:1.5em;margin:.5rem 0 0}
#confetti{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:50}
@keyframes drop{from{transform:translateY(-8px);opacity:0}to{transform:none;opacity:1}}
@keyframes popin{from{transform:scale(.6);opacity:0}to{transform:scale(1);opacity:1}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
main{max-width:76rem}
.title{font-size:clamp(2rem,4.5vw,3.2rem);line-height:1.05;font-weight:800;letter-spacing:-.025em;margin:0 0 .75rem}
.lede{font-size:1.15rem;color:var(--muted);max-width:40rem;margin:0 0 1.5rem}
.welcome{max-width:46rem;margin:2rem auto;text-align:center}
.welcome .big-ic{font-size:4rem;line-height:1;margin-bottom:.75rem}
.welcome .actions{justify-content:center}
.lobby{display:grid;gap:1.75rem;grid-template-columns:minmax(0,1fr)}
@media (min-width:900px){.lobby{grid-template-columns:minmax(0,1fr) minmax(0,1.2fr);align-items:start}}
.joinbox{color:#fff;border-radius:28px;padding:clamp(1.25rem,3vw,2rem);text-align:center;
  background:radial-gradient(circle at 15% 10%,rgba(255,255,255,.12),transparent 40%),linear-gradient(135deg,#1B355A 0%,#3A2A8C 55%,#6A2B8C 100%);box-shadow:0 18px 40px rgba(27,53,90,.35)}
.jb-label{margin:0;font-weight:600;color:rgba(255,255,255,.8)}
.qr{background:#fff;padding:12px;border-radius:18px;display:inline-block;margin:1rem 0 .5rem;line-height:0}
.qr img,.qr canvas{width:clamp(10rem,22vw,14rem)!important;height:auto!important}
.jb-url{margin:0 0 1rem;font-size:clamp(.85rem,1.6vw,1.05rem);overflow-wrap:anywhere;color:#fff}
.pin{font-size:clamp(3rem,8vw,5.5rem);font-weight:800;letter-spacing:.06em;line-height:1;margin:.25rem 0 0;color:var(--sun)}
.pcount{font-size:1.2rem;font-weight:700;margin:0 0 1rem}
.players{display:flex;flex-wrap:wrap;gap:.6rem;min-height:3rem}
.chip{padding:.5rem 1.1rem;border-radius:999px;color:#fff;font-weight:700;font-size:1.05rem;animation:popin .35s cubic-bezier(.2,1.4,.4,1)}
.chip:nth-child(5n+1){background:var(--coral)} .chip:nth-child(5n+2){background:var(--teal)} .chip:nth-child(5n+3){background:var(--sun);color:var(--on-sun)}
.chip:nth-child(5n+4){background:var(--violet)} .chip:nth-child(5n+5){background:var(--pink)}
.waiting{color:var(--muted);font-size:1.1rem}
.hq-top{display:flex;justify-content:space-between;align-items:center;gap:1rem;flex-wrap:wrap;margin-bottom:1rem}
.qcount{font-weight:600;color:var(--muted);font-size:1.1rem}
.hq-card{background:var(--surface);border:2px solid var(--line);border-radius:26px;padding:clamp(1.25rem,3vw,2.25rem);display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:clamp(1rem,3vw,2rem);align-items:center;margin-bottom:1.25rem}
.hq-q{font-size:clamp(1.5rem,3.6vw,2.6rem);line-height:1.2;font-weight:800;margin:0;text-align:center}
.countdown{width:clamp(4.5rem,9vw,6.5rem);aspect-ratio:1;border-radius:50%;display:grid;place-items:center;font-size:clamp(1.8rem,4vw,2.8rem);font-weight:800;color:#fff;background:var(--violet);box-shadow:0 6px 0 #3E2A9E}
.countdown.low{background:var(--coral);box-shadow:0 6px 0 #8E2416}
.answered{text-align:center;font-weight:600;color:var(--muted)}
.answered strong{display:block;font-size:clamp(1.8rem,4vw,2.8rem);color:var(--ink);line-height:1}
.hopts{display:grid;gap:1rem;grid-template-columns:repeat(2,minmax(0,1fr))}
.hopts .tile{font-size:clamp(1.05rem,2.2vw,1.45rem);min-height:5.5rem}
.tile.dim{opacity:.3;box-shadow:none}
.tile.right{outline:5px solid var(--good);outline-offset:4px}
.tile .cnt{margin-left:auto;font-weight:800;font-size:1.4rem;background:rgba(255,255,255,.9);color:var(--tile);border-radius:12px;padding:.1rem .7rem;text-shadow:none}
.tile .barfill{position:absolute;left:0;bottom:0;height:6px;border-radius:0 6px 0 16px;background:rgba(255,255,255,.85)}
.why{margin-top:1.25rem;background:var(--good-soft);border-radius:18px;padding:1rem 1.25rem;display:flex;gap:.9rem;font-size:1.1rem}
.why .em{font-size:2rem;line-height:1}
.lb{max-width:46rem;margin:0 auto}
.lb ol{list-style:none;margin:1rem 0 0;padding:0;display:grid;gap:.7rem}
.lb li{display:flex;align-items:center;gap:1rem;background:var(--surface);border:2px solid var(--line);border-radius:18px;padding:.8rem 1.1rem;font-size:clamp(1.05rem,2.2vw,1.35rem);font-weight:700;animation:drop .4s ease both}
.lb li:nth-child(2){animation-delay:.08s} .lb li:nth-child(3){animation-delay:.16s} .lb li:nth-child(4){animation-delay:.24s} .lb li:nth-child(5){animation-delay:.32s}
.rk{flex:none;width:2.6rem;height:2.6rem;border-radius:50%;display:grid;place-items:center;color:#fff;background:var(--violet);font-weight:800}
.lb li:nth-child(1) .rk{background:var(--sun);color:var(--on-sun)} .lb li:nth-child(2) .rk{background:#9AA7B8} .lb li:nth-child(3) .rk{background:#C47B3C}
.lb .nm{flex:1;overflow-wrap:anywhere}
.lb .gain{color:var(--good);font-size:.9em}
.lb .sc{font-variant-numeric:tabular-nums}
.center{text-align:center}
@media (max-width:640px){.hq-card{grid-template-columns:1fr;text-align:center}.countdown{margin:0 auto}.hopts{grid-template-columns:1fr}}
.chip{display:inline-flex;align-items:center;gap:.45rem;padding:.4rem 1rem .4rem .45rem}
.chip-av{display:grid;place-items:center;width:2rem;height:2rem;border-radius:50%;background:rgba(255,255,255,.9);font-size:1.2rem;line-height:1}
.lb .av{flex:none;display:grid;place-items:center;width:2.8rem;height:2.8rem;border-radius:50%;background:var(--bg);font-size:1.6rem;line-height:1}
.autobar{margin:1.25rem auto 0;max-width:46rem;display:grid;gap:.4rem;color:var(--muted);font-weight:600;font-size:.95rem}
.ab-track{height:8px;border-radius:999px;background:var(--line);overflow:hidden}
.ab-track i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--teal),var(--violet),var(--pink));border-radius:999px}
.autobar.paused .ab-track{opacity:.4}
/* Winners show */
.winners{position:relative;overflow:hidden;border-radius:30px;padding:clamp(1.25rem,3vw,2rem) 1rem 2rem;color:#fff;min-height:72vh;
  background:radial-gradient(circle at 50% 0%,#5B2FA8 0%,#2A1B6E 45%,#1B355A 100%);box-shadow:0 18px 40px rgba(27,53,90,.35)}
.rays{position:absolute;left:50%;top:55%;width:180vmax;height:180vmax;transform:translate(-50%,-50%);pointer-events:none;
  background:repeating-conic-gradient(rgba(255,255,255,.07) 0 9deg,transparent 9deg 18deg);animation:spin 40s linear infinite}
.celebrate .rays{background:repeating-conic-gradient(rgba(255,201,51,.16) 0 9deg,transparent 9deg 18deg);animation-duration:14s}
@keyframes spin{to{transform:translate(-50%,-50%) rotate(360deg)}}
.spot{position:absolute;top:-10%;width:28%;height:120%;pointer-events:none;opacity:0;background:linear-gradient(180deg,rgba(255,255,255,.35),transparent 75%);filter:blur(6px);transition:opacity .6s}
.spot-l{left:22%;transform:rotate(18deg);transform-origin:top} .spot-r{right:22%;transform:rotate(-18deg);transform-origin:top}
.celebrate .spot{opacity:1;animation:sweep 3s ease-in-out infinite alternate}
@keyframes sweep{to{filter:blur(10px) brightness(1.3)}}
.win-title{position:relative;text-align:center;font-size:clamp(1.8rem,4.8vw,3.2rem);font-weight:800;line-height:1.1;margin:.25rem 0 0;text-shadow:0 4px 0 rgba(0,0,0,.25)}
.celebrate .win-title{color:var(--sun);animation:popin .6s cubic-bezier(.2,1.4,.4,1)}
.podium{position:relative;display:flex;justify-content:center;align-items:flex-end;gap:clamp(.5rem,2vw,1.25rem);margin:2rem auto 0;max-width:50rem}
.pod{flex:1;max-width:15rem;text-align:center}
.pod.hide{visibility:hidden}
.pod.show{animation:rise .8s cubic-bezier(.2,1.4,.4,1) both}
@keyframes rise{from{transform:translateY(60px) scale(.6);opacity:0}to{transform:none;opacity:1}}
.pod .avatar{font-size:clamp(2.2rem,6vw,4rem);width:1.7em;height:1.7em;margin:0 auto;display:grid;place-items:center;background:rgba(255,255,255,.14);border-radius:50%;border:4px solid currentColor;line-height:1}
.p1 .avatar{color:var(--sun);box-shadow:0 0 0 6px rgba(245,183,0,.25),0 0 50px rgba(245,183,0,.75);font-size:clamp(2.8rem,7.5vw,5rem)}
.p2 .avatar{color:#D5DEEA} .p3 .avatar{color:#E8A066}
.crown{display:block;font-size:clamp(2rem,5vw,3.2rem);line-height:1;margin-bottom:-.2em;animation:bob 1.2s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-10px) rotate(-8deg)}}
.pod .pn{font-weight:800;font-size:clamp(1.05rem,2.6vw,1.6rem);margin:.5rem 0 .1rem;overflow-wrap:anywhere}
.pod .ps{color:rgba(255,255,255,.8);font-weight:600;margin-bottom:.6rem}
.pod .block{border-radius:18px 18px 0 0;display:grid;place-items:center;box-shadow:inset 0 8px 0 rgba(255,255,255,.25)}
.pod .medal{font-size:clamp(2.2rem,5vw,3.4rem);line-height:1}
.p1 .block{height:clamp(9rem,24vh,14rem);background:linear-gradient(180deg,var(--sun),var(--orange))}
.p2 .block{height:clamp(6.5rem,17vh,10rem);background:linear-gradient(180deg,#B9C6D6,#7F8FA6)}
.p3 .block{height:clamp(5rem,13vh,7.5rem);background:linear-gradient(180deg,#E09A5A,#A8622A)}
.pod.empty{visibility:hidden}

</style>
</head>

  g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(v, t+(o.attack||.002)); g.gain.exponentialRampToValueAtTime(0.0001, t+dur);

const kick  = (t,bus,vol) => osc(150, t, .25, { type:"sine", slide:45, vol:vol||.5, bus });

const PATTERNS = {
  lobby: { bpm:118, play(s,t,dt){

    const roots = [48,45,41,43], ch = [[60,64,67],[57,60,64],[53,57,60],[55,59,62]][bar];

const Music = { timer:null, p:null, step:0, next:0,
  start(name){ this.stop(); const a = ac(); if(!a || !PATTERNS[name]) return; this.p = PATTERNS[name]; this.step = 0; this.next = a.currentTime + .08; this.timer = setInterval(() => this.tick(), 25); },
  tick(){ const dt = 60/this.p.bpm/2; while(this.next < actx.currentTime + .15){ this.p.play(this.step, this.next, dt); this.step++; this.next += dt; } },
  stop(){ clearInterval(this.timer); this.timer = null; }
};

function confetti(count){
  if(reduced) return;
  const cv = document.getElementById("confetti"), ctx = cv.getContext("2d");
  const dpr = window.devicePixelRatio || 1;
  cv.width = innerWidth * dpr; cv.height = innerHeight * dpr; ctx.setTransform(dpr,0,0,dpr,0,0);
  const cs = getComputedStyle(document.documentElement);
  const cols = ["--coral","--sun","--teal","--violet","--lime","--pink"].map(v => cs.getPropertyValue(v).trim());
  const P = Array.from({length:count||160}, () => ({
    x: innerWidth/2 + (Math.random()-.5)*innerWidth*.5, y: innerHeight*.35,
    vx: (Math.random()-.5)*14, vy: -Math.random()*13 - 4,
    s: 6 + Math.random()*8, r: Math.random()*6.28, vr: (Math.random()-.5)*.3,
    c: cols[Math.floor(Math.random()*cols.length)], sh: Math.floor(Math.random()*3)
  }));
  let frames = 0;
  (function tick(){
    ctx.clearRect(0,0,innerWidth,innerHeight);
    P.forEach(p => {
      p.vy += .3; p.vx *= .99; p.x += p.vx; p.y += p.vy; p.r += p.vr;
      ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.r); ctx.fillStyle = p.c;
      if(p.sh === 0) ctx.fillRect(-p.s/2,-p.s/4,p.s,p.s/2);
      else if(p.sh === 1){ ctx.beginPath(); ctx.arc(0,0,p.s/2.5,0,6.28); ctx.fill(); }
      else { ctx.beginPath(); ctx.moveTo(0,-p.s/2); ctx.lineTo(p.s/2,p.s/2); ctx.lineTo(-p.s/2,p.s/2); ctx.fill(); }
      ctx.restore();
    });
    if(++frames < 240) requestAnimationFrame(tick); else ctx.clearRect(0,0,innerWidth,innerHeight);
  })();
}

/* Auto-advance with a visible progress bar and a pause button */
const autoHtml = () => `<div class="autobar" id="autobar"><span id="autolabel"></span><div class="ab-track"><i id="autofill"></i></div></div>`;

function autoNext(sec, fn, label){
  G.auto = { sec, fn, label };
  clearTimeout(G.autoT);
  const bar = document.getElementById("autobar");
  const pb = document.getElementById("pauseBtn");
  if(pb) pb.onclick = () => { G.paused = !G.paused; pb.textContent = G.paused ? "▶️ Resume auto" : "⏸️ Pause auto"; SFX.click(); autoNext(G.auto.sec, G.auto.fn, G.auto.label); };

async function createGame(){
  SFX.click();
  const btn = document.getElementById("create") || document.getElementById("newGame"); if(btn) btn.disabled = true;
  clearAll();
  try{
    if(G.pRef) G.pRef.off();
    let pin = "";
    for(let i=0;i<6;i++){
      pin = String(100000 + Math.floor(Math.random()*900000));
      const s = await db.ref("games/"+pin+"/state").once("value");
      if(!s.exists()) break;
    }
    Object.assign(G, { pin, order: shuffle(QUESTIONS.map((_,i)=>i)), n:0, players:{} });
    await db.ref("games/"+pin).set({ state:"lobby", created:TS, total:QUESTIONS.length });
    G.pRef = db.ref("games/"+pin+"/players");
    G.pRef.on("value", s => {
      const before = Object.keys(G.players).length;
      G.players = s.val() || {};
      const now = Object.keys(G.players).length;
      if(G.phase === "lobby"){ if(now > before) SFX.pop(); renderPlayers(); }
      if(G.phase === "question") checkAnswers();
    });
    Music.start("lobby");
    lobby();
  }catch(e){
    console.error(e);
    app.innerHTML = `<div class="notice"><h1>Couldn’t create the game</h1><p>Check the Firebase config and database rules, then refresh. (${esc(e.message||e)})</p></div>`;

async function startQuestion(){
  clearAll();
  SFX.whoosh();
  G.locked = false; G.ans = {};
  const q = QUESTIONS[G.order[G.n]];
  G.perm = shuffle(q.options.map((_,i)=>i));
  const cur = { n:G.n, total:G.order.length, topic:q.topic, q:q.q, options:G.perm.map(k => q.options[k]), dur:SECONDS_PER_QUESTION, start:TS };
  await db.ref("games/"+G.pin).update({ state:"question", cur });
  const s = await db.ref("games/"+G.pin+"/cur/start").once("value");
  G.start = s.val() || Date.now();
  G.phase = "question";
  Music.start("question");
  app.innerHTML = `
    <div class="hq-top"><span class="topic topic-${q.topic.toLowerCase()}"><span aria-hidden="true">${ICONS[q.topic]||""}</span>${esc(q.topic)}</span>
      <span class="qcount">Question ${G.n+1} of ${G.order.length}</span></div>

function checkAnswers(){
  if(G.phase !== "question") return;
  const got = Object.keys(G.ans).filter(id => G.players[id]).length;
  const np = Object.keys(G.players).length;
  const el = document.getElementById("acount"); if(el) el.textContent = got;
  if(np && got >= np) reveal();
}

async function reveal(){
  if(G.locked || G.phase !== "question") return;
  G.locked = true; clearInterval(G.timer); if(G.ansRef) G.ansRef.off();
  Music.stop();
  const snap = await db.ref(`games/${G.pin}/answers/${G.n}`).once("value");
  const ans = snap.val() || {};
  const q = QUESTIONS[G.order[G.n]];
  const correct = G.perm.indexOf(q.answer);
  const durMs = SECONDS_PER_QUESTION * 1000;
  const counts = G.perm.map(() => 0);
  const up = {};
  Object.entries(G.players).forEach(([pid,p]) => {
    const a = ans[pid]; let pts = 0, ok = false;
    if(a && typeof a.c === "number"){
      counts[a.c] = (counts[a.c]||0) + 1;
      ok = a.c === correct;
      if(ok){ const el = Math.max(0, (a.at || G.start) - G.start); pts = Math.round(500 + 500 * Math.max(0, 1 - el/durMs)); }
    }
    up[`players/${pid}/score`] = (p.score||0) + pts;
    up[`players/${pid}/last`] = { pts, ok, none: !a, n: G.n };
  });
  up["cur/correct"] = correct;
  up.state = "reveal";
  await db.ref("games/"+G.pin).update(up);
  G.phase = "reveal";
  SFX.correct();
  const max = Math.max(1, ...counts);
  app.innerHTML = `
    <div class="hq-top"><span class="topic topic-${q.topic.toLowerCase()}"><span aria-hidden="true">${ICONS[q.topic]||""}</span>${esc(q.topic)}</span>
      <span class="qcount">Question ${G.n+1} of ${G.order.length}</span></div>
    <div class="hq-card" style="grid-template-columns:1fr"><h1 class="hq-q">${esc(q.q)}</h1></div>
    <div class="hopts">${G.perm.map((k,i)=>`<div class="tile c${i} ${i===correct?"right":"dim"}"><span class="letter">${i===correct?"✓":LETTERS[i]}</span><span>${esc(q.options[k])}</span><span class="cnt">${counts[i]}</span><span class="barfill" style="width:${counts[i]/max*100}%"></span></div>`).join("")}</div>
    <div class="why"><span class="em" aria-hidden="true">💡</span><div>${esc(q.why)}</div></div>
    ${autoHtml()}
    <div class="actions">${pauseBtn()}<button class="btn primary" id="toLb">📊 Show points now</button></div>`;
  document.getElementById("toLb").onclick = leaderboard;
  autoNext(AUTO_ANSWER_SECONDS, leaderboard, "Showing points…");
}

async function leaderboard(){
  if(G.phase !== "reveal") return;
  clearTimeout(G.autoT);
  G.phase = "leaderboard";
  SFX.sparkle();
  await db.ref("games/"+G.pin+"/state").set("leaderboard");
  Music.start("calm");
  const last = G.n === G.order.length - 1;
  const top = sorted().slice(0,5);
  const go = () => { if(G.phase !== "leaderboard") return; if(last) finish(); else { G.n++; startQuestion(); } };
  app.innerHTML = `<div class="lb">
    <h1 class="title center">📊 Leaderboard</h1>
    <p class="lede center" style="margin-inline:auto">After question ${G.n+1} of ${G.order.length}</p>
    <ol>${top.map((p,i)=>`<li><span class="rk">${i+1}</span><span class="av">${esc(p.avatar)}</span><span class="nm">${esc(p.name)}</span>${p.gain?`<span class="gain">+${p.gain}</span>`:""}<span class="sc">${p.score}</span></li>`).join("") || `<li><span class="nm">No players yet</span></li>`}</ol>
    ${autoHtml()}
    <div class="actions" style="justify-content:center">${pauseBtn()}<button class="btn primary" id="nextBtn">${last ? "🏆 Show winners" : "Next question ➜"}</button></div></div>`;
  document.getElementById("nextBtn").onclick = go;
  autoNext(AUTO_LEADERBOARD_SECONDS, go, last ? "Revealing the winners…" : "Next question coming up…");
}

async function finish(){
  clearAll(); Music.stop();
  G.phase = "end";
  await db.ref("games/"+G.pin+"/state").set("end");
  const s = sorted();
  const pod = (p, cls, medal) => p ? `<div class="pod ${cls} hide" id="${cls}">
      ${cls==="p1" ? `<span class="crown" aria-hidden="true">👑</span>` : ""}
      <div class="avatar">${esc(p.avatar)}</div>
      <div class="pn">${esc(p.name)}</div><div class="ps">${p.score} points</div>
      <div class="block"><span class="medal" aria-hidden="true">${medal}</span></div></div>` : `<div class="pod ${cls} empty"></div>`;
  app.innerHTML = `<div class="winners">
    <div class="rays" aria-hidden="true"></div>
    <div class="spot spot-l" aria-hidden="true"></div><div class="spot spot-r" aria-hidden="true"></div>
    <h1 class="win-title" id="wtitle">🥁 And the winners are…</h1>
    <div class="podium">${pod(s[1],"p2","🥈")}${pod(s[0],"p1","🥇")}${pod(s[2],"p3","🥉")}</div>
    <div class="actions" style="justify-content:center;position:relative"><button class="btn primary" id="newGame">🔁 New game</button></div></div>`;
  document.getElementById("newGame").onclick = createGame;
  const showPod = (id, big) => { const el = document.getElementById(id); if(!el) return; el.classList.remove("hide"); el.classList.add("show"); if(big){ SFX.crash(); SFX.fanfare(); SFX.applause(4); } else { SFX.crash(); SFX.pop(); } };
  const at = (ms, fn) => G.show.push(setTimeout(fn, ms));
  let t = 0;
  if(s[2]){ SFX.drumroll(2); at(2100, () => showPod("p3")); t = 3000; }
  if(s[1]){ at(t, () => SFX.drumroll(2)); at(t+2100, () => showPod("p2")); t += 3000; }
  at(t, () => SFX.drumroll(2.8));
  at(t+2900, () => {
    showPod("p1", true);
    document.getElementById("wtitle").textContent = s[0] ? `🎉 Congratulations, ${s[0].name}! 🎉` : "🎉 Well played, everyone!";
    document.querySelector(".winners").classList.add("celebrate");
    confetti(260);
  });
  at(t+4400, () => confetti(200));
  at(t+6200, () => confetti(200));
  at(t+8500, () => Music.start("lobby"));
}

setupMute();
if(!configReady() || typeof firebase === "undefined"){ setupScreen(); }
else {
  firebase.initializeApp(window.FIREBASE_CONFIG);
  db = firebase.database();
  TS = firebase.database.ServerValue.TIMESTAMP;
  welcome();
}

</script>
