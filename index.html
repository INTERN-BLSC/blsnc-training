<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>BLSNC Team Skills Quiz</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F2FBFA; --surface:#FFFFFF; --ink:#1B1640; --muted:#57527A; --line:#DCD7F2;
  --head:#1B355A; --on-head:#FFFFFF;
  --coral:#D9432F; --teal:#0E8C8C; --sun:#F5B700; --violet:#6A4BE0; --lime:#5DAE2C; --pink:#E0457B;
  --on-sun:#1B1640; --good:#1E9E5A; --good-soft:#DDF6E8; --bad:#D9432F; --bad-soft:#FDE4DF;
  --deco-o:.16;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#120E2E; --surface:#1E1846; --ink:#F2F0FF; --muted:#B7B1DD; --line:#352C6E;
    --head:#1B355A; --on-head:#FFFFFF;
    --coral:#E8553F; --teal:#14A3A3; --sun:#FFC933; --violet:#8468FF; --lime:#7CCB4A; --pink:#FF6A9C;
    --on-sun:#1B1640; --good:#4ED68A; --good-soft:#163D2C; --bad:#FF7A66; --bad-soft:#401E24;
    --deco-o:.22;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#120E2E; --surface:#1E1846; --ink:#F2F0FF; --muted:#B7B1DD; --line:#352C6E;
  --head:#1B355A; --on-head:#FFFFFF;
  --coral:#E8553F; --teal:#14A3A3; --sun:#FFC933; --violet:#8468FF; --lime:#7CCB4A; --pink:#FF6A9C;
  --on-sun:#1B1640; --good:#4ED68A; --good-soft:#163D2C; --bad:#FF7A66; --bad-soft:#401E24;
  --deco-o:.22;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Lexend",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;line-height:1.5;-webkit-text-size-adjust:100%;min-height:100%;position:relative;overflow-x:hidden}
button,input{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--sun);outline-offset:3px}

/* Decorative background shapes */
.deco{position:fixed;inset:0;pointer-events:none;z-index:0;opacity:var(--deco-o)}
.deco svg{position:absolute}
.d1{top:6rem;left:-3rem;width:12rem;color:var(--coral)}
.d2{top:40%;right:-2.5rem;width:10rem;color:var(--teal)}
.d3{bottom:4rem;left:8%;width:7rem;color:var(--violet)}
.d4{top:9rem;right:12%;width:4rem;color:var(--sun)}
.d5{bottom:20%;right:22%;width:3rem;color:var(--pink)}

/* Header with woven zigzag band */
.bar{background:var(--head);color:var(--on-head);position:relative;z-index:1}
.bar-inner{max-width:48rem;margin:0 auto;padding:.9rem 1.25rem;display:flex;align-items:center;justify-content:space-between;gap:1rem}
.brand{display:flex;align-items:center;gap:.6rem;font-weight:700;font-size:1.05rem}
.mark{display:grid;grid-template-columns:repeat(2,.6rem);gap:3px}
.mark i{width:.6rem;height:.6rem;border-radius:3px;display:block}
.mark i:nth-child(1){background:var(--coral)} .mark i:nth-child(2){background:var(--sun)}
.mark i:nth-child(3){background:var(--teal)} .mark i:nth-child(4){background:var(--violet)}
.link-btn{background:rgba(255,255,255,.12);border:0;color:var(--on-head);border-radius:999px;padding:.4rem 1rem;font-size:.9rem;cursor:pointer}
.link-btn:hover{background:rgba(255,255,255,.22)}
.link-btn{white-space:nowrap}
@media (max-width:420px){.link-btn{font-size:.8rem;padding:.35rem .75rem}}
.logo-icon{height:2.6rem;width:auto;display:block}
.wordmark{display:flex;flex-direction:column;line-height:1.05}
.wm-main{font-weight:700;font-size:1.25rem;letter-spacing:.04em}
.wm-sub{font-weight:400;font-size:.62rem;letter-spacing:.12em;text-transform:uppercase;color:#F6A23A;margin-top:.2rem;padding-top:.2rem;border-top:1px solid rgba(255,255,255,.35);white-space:nowrap}
.head-btns{display:flex;gap:.5rem;flex-wrap:wrap;justify-content:flex-end}
.weave{height:14px;background:
  linear-gradient(135deg,var(--coral) 25%,transparent 25%) -7px 0/14px 14px,
  linear-gradient(225deg,var(--sun) 25%,transparent 25%) -7px 0/14px 14px,
  linear-gradient(315deg,var(--teal) 25%,transparent 25%) 0 0/14px 14px,
  linear-gradient(45deg,var(--violet) 25%,transparent 25%) 0 0/14px 14px;
  background-color:var(--head)}
.track{height:8px;background:var(--line);position:relative;z-index:1}
.track-fill{height:100%;width:0;background:linear-gradient(90deg,var(--coral),var(--sun),var(--teal),var(--violet));transition:width .4s ease;border-radius:0 999px 999px 0}

main{max-width:48rem;margin:0 auto;padding:2rem 1.25rem 4rem;position:relative;z-index:1}

/* Start screen */
.hero-title{font-size:clamp(2.2rem,6.5vw,3.6rem);line-height:1.05;font-weight:800;letter-spacing:-.025em;margin:.5rem 0 1rem}
.hero-title .w{display:inline-block;padding:0 .12em;border-radius:.14em;margin:.04em 0}
.hero-title .w1{background:var(--coral);color:#fff;transform:rotate(-2deg)}
.hero-title .w2{background:var(--teal);color:#fff;transform:rotate(1.5deg)}
.hero-title .w3{background:var(--sun);color:var(--on-sun);transform:rotate(-1deg)}
.lede{font-size:1.15rem;color:var(--muted);max-width:36rem;margin:0 0 1.75rem}
.topic-cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:.75rem;margin:0 0 2rem;padding:0;list-style:none}
.topic-cards li{border-radius:16px;padding:1rem .9rem;color:#fff;font-weight:600;font-size:clamp(.85rem,2.6vw,1rem)}
.topic-cards .ic{display:block;font-size:1.8rem;line-height:1;margin-bottom:.5rem}
.tc-teamwork{background:var(--coral)} .tc-communication{background:var(--teal)} .tc-leadership{background:var(--violet)}
.setup{background:var(--surface);border:2px solid var(--line);border-radius:20px;padding:1.25rem 1.25rem .25rem}
.field{margin-bottom:1rem}
.field label{display:block;font-weight:600;margin-bottom:.4rem}
.field input[type=text]{width:100%;max-width:24rem;padding:.75rem .9rem;border:2px solid var(--line);border-radius:12px;background:var(--bg)}
.check{display:flex;align-items:flex-start;gap:.65rem;margin:.6rem 0;cursor:pointer}
.check input{width:1.25rem;height:1.25rem;margin-top:.15rem;accent-color:var(--violet)}
.check small{display:block;color:var(--muted)}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:.5rem;border-radius:14px;padding:.9rem 1.7rem;font-weight:700;font-size:1.1rem;cursor:pointer;border:0;min-height:3.4rem;transition:transform .12s}
.btn:active{transform:translateY(2px)}
.btn.primary{background:linear-gradient(180deg,rgba(255,255,255,.25),rgba(255,255,255,0) 55%),linear-gradient(120deg,var(--violet),var(--pink));color:#fff;border-radius:999px;padding:1rem 2.1rem;font-size:1.15rem;box-shadow:0 6px 0 #3E2A9E,0 12px 24px rgba(106,75,224,.35);text-shadow:0 1px 0 rgba(0,0,0,.2)}
.btn.primary:hover{transform:translateY(-2px);filter:brightness(1.08);box-shadow:0 8px 0 #3E2A9E,0 16px 28px rgba(106,75,224,.4)}
.btn.primary:active{transform:translateY(4px);box-shadow:0 2px 0 #3E2A9E}
.btn.ghost{background:var(--surface);border:3px solid var(--violet);color:var(--violet);border-radius:999px;box-shadow:0 6px 0 var(--line)}
.btn.ghost:hover{transform:translateY(-2px)}
.btn.pulse{animation:pulse 1.8s ease-in-out 4}
@keyframes pulse{0%,100%{box-shadow:0 6px 0 #3E2A9E,0 0 0 0 rgba(224,69,123,.5)}50%{box-shadow:0 6px 0 #3E2A9E,0 0 0 14px rgba(224,69,123,0)}}
.actions{display:flex;flex-wrap:wrap;gap:.9rem;margin-top:1.75rem}

/* Question screen */
.meta{display:flex;justify-content:space-between;align-items:center;gap:1rem;color:var(--muted);font-size:.95rem;margin:0 0 1rem;flex-wrap:wrap}
.topic{display:inline-flex;align-items:center;gap:.4rem;font-weight:700;font-size:.9rem;padding:.3rem .8rem;border-radius:999px;color:#fff}
.topic-teamwork{background:var(--coral)} .topic-communication{background:var(--teal)} .topic-leadership{background:var(--violet)}
.right-meta{display:flex;align-items:center;gap:.6rem}
.streak{background:var(--sun);color:var(--on-sun);font-weight:700;border-radius:999px;padding:.2rem .7rem;font-size:.85rem}
.qcard{background:var(--surface);border-radius:22px;padding:clamp(1.25rem,4vw,2rem);border:2px solid var(--line);position:relative;overflow:hidden;margin-bottom:1.25rem}
.qcard::before{content:"";position:absolute;left:0;top:0;bottom:0;width:8px;background:var(--tcol,var(--violet))}
.qnum{font-weight:800;font-size:.95rem;color:var(--tcol,var(--violet));margin:0 0 .4rem}
.question{font-size:clamp(1.4rem,3.6vw,2rem);line-height:1.25;font-weight:700;margin:0;outline:none}
.opts{display:grid;gap:.75rem;grid-template-columns:minmax(0,1fr)}
@media (min-width:640px){.opts{grid-template-columns:repeat(2,minmax(0,1fr))}}
.opt{display:flex;align-items:center;gap:.85rem;width:100%;text-align:left;border:3px solid rgba(255,255,255,.35);border-radius:20px;padding:1rem 1.1rem;text-shadow:0 1px 0 rgba(0,0,0,.15);font-size:clamp(1rem,2.2vw,1.1rem);font-weight:500;cursor:pointer;color:#fff;min-height:4.5rem;box-shadow:0 5px 0 rgba(0,0,0,.22);transition:transform .12s,opacity .2s,box-shadow .12s;position:relative}
.opt:hover:not(:disabled){transform:translateY(-2px);box-shadow:0 7px 0 rgba(0,0,0,.22)}
.opt:active:not(:disabled){transform:translateY(3px);box-shadow:0 2px 0 rgba(0,0,0,.22)}
.opt:disabled{cursor:default}
.c0{--tile:var(--coral);background:linear-gradient(180deg,rgba(255,255,255,.24),rgba(255,255,255,0) 60%),var(--coral)}
.c1{--tile:var(--teal);background:linear-gradient(180deg,rgba(255,255,255,.24),rgba(255,255,255,0) 60%),var(--teal)}
.c2{--tile:#C98F00;background:linear-gradient(180deg,rgba(255,255,255,.35),rgba(255,255,255,0) 60%),var(--sun);color:var(--on-sun);text-shadow:none}
.c3{--tile:var(--violet);background:linear-gradient(180deg,rgba(255,255,255,.24),rgba(255,255,255,0) 60%),var(--violet)}
.shape{flex:none;width:2.6rem;height:2.6rem;display:grid;place-items:center;border-radius:50%;background:#fff;color:var(--tile);box-shadow:0 3px 0 rgba(0,0,0,.15);transition:transform .2s}
.opt:hover:not(:disabled) .shape{transform:rotate(-12deg) scale(1.1)}
.shape{font-weight:800;font-size:1.3rem;line-height:1;text-shadow:none}
.opt .tick{margin-left:auto;flex:none;width:2rem;height:2rem;border-radius:50%;display:none;place-items:center;font-weight:800;background:#fff}
.opt.is-right .tick{display:grid;color:var(--good)}
.opt.is-wrong .tick{display:grid;color:var(--bad)}
.opt.is-right{outline:4px solid var(--good);outline-offset:3px}
.opt.is-wrong{outline:4px dashed var(--bad);outline-offset:3px}
.opt:disabled:not(.is-right):not(.is-wrong){opacity:.3;box-shadow:none}
.feedback{margin:1.4rem 0 0;padding:1rem 1.2rem;border-radius:16px;display:flex;gap:.9rem;align-items:flex-start}
.feedback.good{background:var(--good-soft)} .feedback.bad{background:var(--bad-soft)}
.feedback .em{font-size:2rem;line-height:1}
.feedback p{margin:.15rem 0}
.verdict{font-weight:800;font-size:1.15rem}
.good .verdict{color:var(--good)} .bad .verdict{color:var(--bad)}
.timer{height:12px;border-radius:999px;background:var(--line);overflow:hidden;margin-bottom:.4rem}
.timer-fill{height:100%;width:100%;background:linear-gradient(90deg,var(--teal),var(--lime))}
.timer-fill.low{background:var(--coral)}
.secs{margin:0 0 1rem;color:var(--muted);font-size:.9rem;font-variant-numeric:tabular-nums}

/* Results */
.res-head{display:flex;align-items:center;gap:clamp(1rem,4vw,2rem);flex-wrap:wrap;margin:.5rem 0 1.5rem}
.ring{--p:0;width:clamp(9rem,34vw,12rem);aspect-ratio:1;border-radius:50%;flex:none;display:grid;place-items:center;
  background:conic-gradient(var(--coral) 0, var(--sun) calc(var(--p)*.5%), var(--teal) calc(var(--p)*1%), var(--line) 0)}
.ring-in{width:76%;aspect-ratio:1;border-radius:50%;background:var(--bg);display:grid;place-items:center;text-align:center}
.score-big{font-size:clamp(2.6rem,9vw,3.6rem);font-weight:800;line-height:1;letter-spacing:-.03em}
.score-of{display:block;font-size:.95rem;color:var(--muted);font-weight:500}
.res-title{font-size:clamp(1.9rem,5.5vw,2.8rem);line-height:1.1;font-weight:800;margin:0 0 .4rem;outline:none}
.badge{display:inline-block;font-weight:700;padding:.3rem .8rem;border-radius:999px;background:var(--sun);color:var(--on-sun)}
.breakdown{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:.75rem;margin:0 0 1.5rem}
.bk{border-radius:16px;padding:1rem .9rem;color:#fff}
.bk .ic{font-size:1.5rem;line-height:1}
.bk .nm{font-weight:600;font-size:clamp(.8rem,2.4vw,.95rem);margin:.4rem 0 .1rem}
.bk .sc{font-size:clamp(1.4rem,4.5vw,2rem);font-weight:800}
details{background:var(--surface);border:2px solid var(--line);border-radius:16px;padding:.25rem 1.1rem;margin-top:1rem}
summary{cursor:pointer;font-weight:700;padding:.8rem 0}
.review{list-style:none;margin:0;padding:0 0 .5rem}
.review li{border-top:1px solid var(--line);padding:.9rem 0}
.review .q{font-weight:600;margin:0 0 .3rem}
.review .a{margin:.15rem 0;font-size:.95rem}
.ok{color:var(--good);font-weight:700} .no{color:var(--bad);font-weight:700}
.stamp{color:var(--muted);font-size:.9rem;margin-top:.75rem}
@media (max-width:480px){
  .topic-cards,.breakdown{grid-template-columns:minmax(0,1fr)}
  .topic-cards li{display:flex;align-items:center;gap:.75rem;padding:.75rem 1rem;font-size:1rem}
  .topic-cards .ic{margin:0;font-size:1.5rem}
  .bk{display:flex;align-items:center;gap:.75rem;padding:.75rem 1rem}
  .bk .nm{margin:0;font-size:1rem;flex:1}
  .bk .sc{font-size:1.4rem}
}
#confetti{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:5}
@keyframes popin{from{transform:scale(.6);opacity:0}to{transform:scale(1);opacity:1}}
.ring{animation:popin .5s cubic-bezier(.2,1.4,.4,1)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>

<script>
/* ============================================================
   EDIT HERE FOR FUTURE SESSIONS
   - Change the title, timer length or questions below.
   - topic must be "Teamwork", "Communication" or "Leadership".
   - answer is the position of the correct option: 0 = first, 1 = second…
   - Options are shuffled automatically when the quiz runs.
   ============================================================ */
const QUIZ_TITLE = "Teamwork, communication & leadership";
const SECONDS_PER_QUESTION = 15;
const QUESTIONS = [
  { topic:"Teamwork", q:"A teammate is falling behind on a task the whole group depends on. What’s the best first step?",
    options:["Report them to the manager straight away","Ask what’s blocking them and offer help","Quietly redo their work yourself","Wait and see if they catch up"],
    answer:1, why:"Starting with a supportive conversation solves the problem faster and builds trust. Escalate only if that doesn’t work." },
  { topic:"Teamwork", q:"What makes a team meeting most productive?",
    options:["Inviting as many people as possible","Letting the most senior person do the talking","A clear purpose, agenda and agreed next steps","Keeping it informal with no plan"],
    answer:2, why:"A clear purpose and agenda keep the discussion focused, and agreed actions make sure something happens afterwards." },
  { topic:"Teamwork", q:"Two team members strongly disagree on how to approach a project. What should happen?",
    options:["Go with whoever spoke first","Avoid the topic until it settles down","Take a vote without discussion","Discuss the shared goal and compare options on their merits"],
    answer:3, why:"Healthy disagreement improves decisions when it stays focused on the goal and the evidence, not on people." },
  { topic:"Teamwork", q:"What does “psychological safety” in a team mean?",
    options:["People can speak up, ask questions and admit mistakes without fear","Nobody ever gets critical feedback","Everyone has a secure contract","The team avoids risky projects"],
    answer:0, why:"When people feel safe to speak up, problems surface early and ideas get shared, which makes teams perform better." },
  { topic:"Communication", q:"Which of these is the clearest sign of active listening?",
    options:["Preparing your reply while the other person talks","Summarising what you heard to check you understood","Nodding while checking your phone","Finishing the other person’s sentences"],
    answer:1, why:"Paraphrasing shows you were paying attention and gives the speaker a chance to correct any misunderstanding." },
  { topic:"Communication", q:"What makes feedback most useful to the person receiving it?",
    options:["Keeping it general so it doesn’t sound harsh","Saving it all for the annual review","Describing the specific behaviour and its impact","Sharing it in front of the whole team"],
    answer:2, why:"Specific, behaviour-focused feedback tells people exactly what to keep doing or change, and why it matters." },
  { topic:"Communication", q:"You’ve just given your team an important instruction. What should you do next?",
    options:["Check that everyone understood and invite questions","Move on quickly to save time","Assume silence means agreement","Repeat it louder"],
    answer:0, why:"Checking understanding catches confusion before it turns into mistakes. Silence doesn’t always mean people understood." },
  { topic:"Communication", q:"Which of these is an example of non-verbal communication?",
    options:["An email update","A written report","A phone message","Eye contact and facial expression"],
    answer:3, why:"Body language, eye contact, facial expression and tone often say as much as the words themselves." },
  { topic:"Leadership", q:"What is the most effective way to delegate a task?",
    options:["Give it to whoever is free, with no explanation","Match it to someone’s skills and agree clear expectations","Hand it over, then check every small step","Keep important tasks to yourself"],
    answer:1, why:"Good delegation matches the task to the person, makes the expected outcome clear, and trusts them to deliver." },
  { topic:"Leadership", q:"Your team makes a costly mistake. How should a good leader respond?",
    options:["Find out who is to blame","Pretend it didn’t happen","Focus on fixing it and learning how to prevent it","Take over all future decisions"],
    answer:2, why:"Focusing on solutions and lessons keeps people honest about mistakes, so they get reported and fixed sooner." },
  { topic:"Leadership", q:"What does “leading by example” mean?",
    options:["Showing the behaviour you expect from others","Being the first to arrive and last to leave","Telling stories about your past successes","Doing everyone else’s work"],
    answer:0, why:"People follow what leaders do more than what they say, so modelling the right behaviour sets the standard." },
  { topic:"Leadership", q:"Which approach usually motivates a team best over the long term?",
    options:["Strict rules and frequent warnings","Rewards for the top performer only","Keeping goals vague to stay flexible","Recognising effort and connecting work to a clear purpose"],
    answer:3, why:"Recognition and a sense of purpose build lasting motivation; fear and narrow rewards tend to wear people down." },
  { topic:"Teamwork", q:"A new member has just joined your team. What helps them settle in fastest?",
    options:["Let them figure things out alone","Introduce them, explain how the team works and pair them with a buddy","Give them the hardest task to test them","Only talk to them when they make a mistake"],
    answer:1, why:"A warm welcome, clear information and a buddy help new members feel included and become productive sooner." },
  { topic:"Communication", q:"When is a face-to-face or video conversation better than an email?",
    options:["When sharing a simple meeting time","When sending a document for reference","When the topic is sensitive or could easily be misunderstood","Never, email is always better"],
    answer:2, why:"Sensitive or complex topics need tone, facial expression and the chance to ask questions, which email can’t give." },
  { topic:"Leadership", q:"A team member shares an idea you disagree with in a meeting. What should a leader do?",
    options:["Dismiss it quickly to save time","Thank them, ask questions to understand it, then share your view","Ignore it and move on","Criticise it so others learn"],
    answer:1, why:"Respecting ideas, even ones you disagree with, keeps people willing to contribute and sometimes changes your mind." }
];
/* ============================================================ */

const TOPICS = ["Teamwork","Communication","Leadership"];
const ICONS = { Teamwork:"🤝", Communication:"👥", Leadership:"👑" };
const TCOL = { Teamwork:"var(--coral)", Communication:"var(--teal)", Leadership:"var(--violet)" };
const SHAPES = [
  '<svg viewBox="0 0 20 20"><circle cx="10" cy="10" r="8"/></svg>',
  '<svg viewBox="0 0 20 20"><path d="M10 2 19 18H1Z"/></svg>',
  '<svg viewBox="0 0 20 20"><rect x="2" y="2" width="16" height="16" rx="3"/></svg>',
  '<svg viewBox="0 0 20 20"><path d="M10 1 19 10 10 19 1 10Z"/></svg>'
];
const app = document.getElementById("app");
const progress = document.getElementById("progress");
const restartBtn = document.getElementById("restart");
const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;
let S = null;

/* Sound effects, made in the browser (no files needed) */
let actx = null, muted = false;
try{ muted = localStorage.getItem("blsc-quiz-muted") === "1"; }catch(e){}
function ac(){
  if(!actx){ const C = window.AudioContext || window.webkitAudioContext; if(!C) return null; actx = new C(); }
  if(actx.state === "suspended") actx.resume();
  return actx;
}
function tone(freq, start, dur, type, vol){
  if(muted) return; const a = ac(); if(!a) return;
  const t = a.currentTime + start, o = a.createOscillator(), g = a.createGain();
  o.type = type || "triangle"; o.frequency.setValueAtTime(freq, t);
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(vol || .18, t + .015);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g); g.connect(a.destination); o.start(t); o.stop(t + dur + .05);
}
const SFX = {
  click:   () => tone(660, 0, .08, "triangle", .12),
  correct: () => { tone(523.25,0,.15); tone(659.25,.1,.15); tone(783.99,.2,.32); },
  wrong:   () => { tone(220,0,.25,"sawtooth",.09); tone(174.6,.18,.38,"sawtooth",.09); },
  tick:    () => tone(1000, 0, .05, "square", .05),
  timeup:  () => { tone(440,0,.18,"square",.08); tone(330,.2,.18,"square",.08); tone(247,.4,.45,"square",.08); },
  fanfare: () => { [523.25,659.25,783.99,1046.5].forEach((f,i)=>tone(f,i*.13,.22)); tone(1046.5,.55,.7,"triangle",.16); tone(783.99,.55,.7,"triangle",.1); },
  gentle:  () => { tone(392,0,.2); tone(523.25,.18,.4); }
};

const esc = t => String(t).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function shuffle(a){ a = a.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function setProgress(f){ progress.style.width = (f*100) + "%"; }
function stopTimer(){ if(S && S.timer){ clearInterval(S.timer); S.timer = null; } }

function startScreen(prev){
  stopTimer(); setProgress(0); restartBtn.hidden = true;
  S = { screen:"start" };
  app.innerHTML = `
    <h1 class="hero-title"><span class="w w1">Teamwork</span>, <span class="w w2">communication</span> &amp; <span class="w w3">leadership</span></h1>
    <p class="lede">${QUESTIONS.length} questions, ${SECONDS_PER_QUESTION} seconds each. Pick one answer each time, see why it’s right, and get your score at the end.</p>
    <ul class="topic-cards">${TOPICS.map(t=>`<li class="tc-${t.toLowerCase()}"><span class="ic" aria-hidden="true">${ICONS[t]}</span>${t}</li>`).join("")}</ul>
    <div class="setup">
      <div class="field">
        <label for="pname">Your name or team name (optional)</label>
        <input type="text" id="pname" autocomplete="off" value="${esc(prev && prev.name || "")}">
      </div>
    </div>
    <div class="actions"><button class="btn primary pulse" id="go">📝 Start quiz</button></div>`;
  document.getElementById("go").onclick = () => {
    const name = document.getElementById("pname").value.trim();
    begin({ name, timed:true, mix:true });
  };
}

function begin(o){
  const idx = QUESTIONS.map((_,i)=>i);
  S = { screen:"q", ...o, order: o.mix ? shuffle(idx) : idx, i:0, score:0, streak:0, best:0, log:[], timer:null };
  restartBtn.hidden = false;
  SFX.click();
  showQuestion();
}

function showQuestion(){
  const q = QUESTIONS[S.order[S.i]];
  S.screen = "q"; S.locked = false;
  S.opts = shuffle(q.options.map((t,k)=>({t,k})));
  setProgress(S.i / S.order.length);
  app.innerHTML = `
    <div class="meta">
      <span class="topic topic-${q.topic.toLowerCase()}"><span aria-hidden="true">${ICONS[q.topic]||""}</span>${esc(q.topic)}</span>
      <span class="right-meta">${S.streak >= 2 ? `<span class="streak">🔥 ${S.streak} in a row</span>` : ""}<span>${S.i+1} of ${S.order.length}</span></span>
    </div>
    ${S.timed ? `<div class="timer" aria-hidden="true"><div class="timer-fill" id="tf"></div></div><p class="secs" id="secs"></p>` : ""}
    <div class="qcard" style="--tcol:${TCOL[q.topic]||"var(--violet)"}">
      <p class="qnum">Question ${S.i+1}</p>
      <h2 class="question" id="qtext" tabindex="-1">${esc(q.q)}</h2>
    </div>
    <div class="opts" role="group" aria-labelledby="qtext">
      ${S.opts.map((o,n)=>`<button class="opt c${n}" data-n="${n}" aria-label="${"ABCD"[n]}: ${esc(o.t)}"><span class="shape" aria-hidden="true">${"ABCD"[n]}</span><span>${esc(o.t)}</span><span class="tick" aria-hidden="true"></span></button>`).join("")}
    </div>
    <div id="fb"></div>`;
  app.querySelectorAll(".opt").forEach(b => b.onclick = () => choose(+b.dataset.n));
  document.getElementById("qtext").focus({preventScroll:true});
  window.scrollTo(0,0);
  if(S.timed) startTimer();
}

function startTimer(){
  let left = SECONDS_PER_QUESTION;
  const fill = document.getElementById("tf"), secs = document.getElementById("secs");
  secs.textContent = left + " seconds left";
  fill.style.transition = "none"; fill.style.width = "100%";
  requestAnimationFrame(()=>requestAnimationFrame(()=>{
    fill.style.transition = `width ${SECONDS_PER_QUESTION}s linear`; fill.style.width = "0%";
  }));
  S.timer = setInterval(()=>{
    left--;
    secs.textContent = Math.max(left,0) + (left===1 ? " second left" : " seconds left");
    if(left <= 5){ fill.classList.add("low"); if(left > 0) SFX.tick(); }
    if(left <= 0) choose(-1);
  }, 1000);
}

const PRAISE = ["Correct!","Spot on!","Nailed it!","Well done!","That’s right!"];
function choose(n){
  if(S.locked) return;
  S.locked = true; stopTimer();
  const fill = document.getElementById("tf");
  if(fill){ const w = getComputedStyle(fill).width; fill.style.transition = "none"; fill.style.width = w; }
  const q = QUESTIONS[S.order[S.i]];
  const chosen = n < 0 ? -1 : S.opts[n].k;
  const ok = chosen === q.answer;
  if(ok){ S.score++; S.streak++; S.best = Math.max(S.best, S.streak); } else { S.streak = 0; }
  S.log.push({ qi:S.order[S.i], chosen, ok });
  (n < 0 ? SFX.timeup : ok ? SFX.correct : SFX.wrong)();
  app.querySelectorAll(".opt").forEach((b,m)=>{
    b.disabled = true;
    const t = b.querySelector(".tick");
    if(S.opts[m].k === q.answer){ b.classList.add("is-right"); t.textContent = "✓"; }
    else if(m === n){ b.classList.add("is-wrong"); t.textContent = "✗"; }
  });
  const last = S.i === S.order.length - 1;
  const fb = document.getElementById("fb");
  const verdict = n < 0 ? "Time’s up!" : ok ? PRAISE[Math.floor(Math.random()*PRAISE.length)] : "Not quite.";
  const em = n < 0 ? "⏰" : ok ? (S.streak >= 3 ? "🔥" : "🎉") : "💡";
  fb.innerHTML = `
    <div class="feedback ${ok?"good":"bad"}" role="status">
      <span class="em" aria-hidden="true">${em}</span>
      <div><p class="verdict">${verdict}</p><p>${esc(q.why)}</p></div>
    </div>
    <div class="actions"><button class="btn primary" id="next">${last ? "📊 See my results" : "Next question ➜"}</button></div>`;
  const next = document.getElementById("next");
  next.onclick = () => { SFX.click(); if(last){ showResults(); } else { S.i++; showQuestion(); } };
  next.focus({preventScroll:true});
  fb.scrollIntoView({block:"nearest", behavior: reduced ? "auto" : "smooth"});
}

function showResults(){
  S.screen = "results"; setProgress(1);
  const total = S.order.length, pct = Math.round(S.score / total * 100);
  const title = pct >= 80 ? "Team superstar!" : pct >= 50 ? "Great effort!" : "Good start!";
  const msg = pct >= 80 ? "You have a strong grasp of what makes teams work well."
            : pct >= 50 ? "Check the answers below to strengthen a few areas."
            : "Go through the answers below, then give it another try.";
  const cards = TOPICS.map(t=>{
    const items = S.log.filter(l => QUESTIONS[l.qi].topic === t);
    if(!items.length) return "";
    const got = items.filter(l=>l.ok).length;
    return `<div class="bk tc-${t.toLowerCase()}"><div class="ic" aria-hidden="true">${ICONS[t]}</div><p class="nm">${t}</p><div class="sc">${got}/${items.length}</div></div>`;
  }).join("");
  const review = S.log.map((l,n)=>{
    const q = QUESTIONS[l.qi];
    const yours = l.chosen < 0 ? "No answer (time ran out)" : q.options[l.chosen];
    return `<li><p class="q">${n+1}. ${esc(q.q)}</p>
      <p class="a">Your answer: <span class="${l.ok?"ok":"no"}">${l.ok?"✓ ":"✗ "}${esc(yours)}</span></p>
      ${l.ok ? "" : `<p class="a">Correct answer: <span class="ok">${esc(q.options[q.answer])}</span></p>`}</li>`;
  }).join("");
  const now = new Date();
  app.innerHTML = `
    <div class="res-head">
      <div class="ring" style="--p:${pct}"><div class="ring-in"><div><span class="score-big">${S.score}</span><span class="score-of">out of ${total}</span></div></div></div>
      <div>
        <h1 class="res-title" tabindex="-1">${title}${S.name ? "<br>" + esc(S.name) : ""}</h1>
        <span class="badge">${pct}%${S.best >= 3 ? " · best streak " + S.best + " 🔥" : ""}</span>
      </div>
    </div>
    <p class="lede">${msg}</p>
    <div class="breakdown">${cards}</div>
    <details><summary>Review all answers</summary><ul class="review">${review}</ul></details>
    <p class="stamp">Completed ${now.toLocaleDateString(undefined,{day:"numeric",month:"long",year:"numeric"})}, ${now.toLocaleTimeString(undefined,{hour:"2-digit",minute:"2-digit"})}</p>
    <div class="actions">
      <button class="btn primary" id="again">🔁 Play again</button>
      <button class="btn ghost" id="new">👤 New player</button>
    </div>`;
  const prev = { name:S.name, timed:S.timed, mix:S.mix };
  document.getElementById("again").onclick = () => begin(prev);
  document.getElementById("new").onclick = () => startScreen({ timed:prev.timed, mix:prev.mix });
  document.querySelector(".res-title").focus({preventScroll:true});
  window.scrollTo(0,0);
  (pct >= 50 ? SFX.fanfare : SFX.gentle)();
  if(pct >= 50) confetti(pct >= 80 ? 180 : 90);
}

function confetti(count){
  if(reduced) return;
  const cv = document.getElementById("confetti"), ctx = cv.getContext("2d");
  const dpr = window.devicePixelRatio || 1;
  cv.width = innerWidth * dpr; cv.height = innerHeight * dpr; ctx.scale(dpr, dpr);
  const cs = getComputedStyle(document.documentElement);
  const cols = ["--coral","--sun","--teal","--violet","--lime","--pink"].map(v => cs.getPropertyValue(v).trim());
  const P = Array.from({length:count}, () => ({
    x: innerWidth/2 + (Math.random()-.5)*innerWidth*.4, y: innerHeight*.35,
    vx: (Math.random()-.5)*12, vy: -Math.random()*12 - 4,
    s: 6 + Math.random()*7, r: Math.random()*6.28, vr: (Math.random()-.5)*.3,
    c: cols[Math.floor(Math.random()*cols.length)], sh: Math.floor(Math.random()*3)
  }));
  let frames = 0;
  (function tick(){
    ctx.clearRect(0,0,innerWidth,innerHeight);
    P.forEach(p => {
      p.vy += .32; p.vx *= .99; p.x += p.vx; p.y += p.vy; p.r += p.vr;
      ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.r); ctx.fillStyle = p.c;
      if(p.sh === 0) ctx.fillRect(-p.s/2,-p.s/4,p.s,p.s/2);
      else if(p.sh === 1){ ctx.beginPath(); ctx.arc(0,0,p.s/2.5,0,6.28); ctx.fill(); }
      else { ctx.beginPath(); ctx.moveTo(0,-p.s/2); ctx.lineTo(p.s/2,p.s/2); ctx.lineTo(-p.s/2,p.s/2); ctx.fill(); }
      ctx.restore();
    });
    if(++frames < 220) requestAnimationFrame(tick); else ctx.clearRect(0,0,innerWidth,innerHeight);
  })();
}

document.addEventListener("keydown", e => {
  if(!S || S.screen !== "q" || S.locked) return;
  if(e.target.tagName === "INPUT" || e.ctrlKey || e.metaKey || e.altKey) return;
  const k = e.key.toLowerCase();
  let n = "abcd".indexOf(k); if(n < 0) n = "1234".indexOf(k);
  if(n >= 0 && n < S.opts.length){ e.preventDefault(); choose(n); }
});
restartBtn.onclick = () => startScreen(S ? { name:S.name, timed:S.timed, mix:S.mix } : null);
const muteBtn = document.getElementById("mute");
function paintMute(){ muteBtn.textContent = muted ? "🔇 Sound off" : "🔊 Sound on"; muteBtn.setAttribute("aria-pressed", String(!muted)); }
muteBtn.onclick = () => { muted = !muted; try{ localStorage.setItem("blsc-quiz-muted", muted ? "1" : "0"); }catch(e){} paintMute(); SFX.click(); };
paintMute();
startScreen();
</script>
</body>
